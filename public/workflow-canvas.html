    function projectExecutionStripOrder() {
      const loopPlans = workflowLoopPlans();
      if (loopPlans.length) {
        const route = [];
        loopPlans.forEach((plan) => {
          route.push(plan.loopNode.id, ...plan.routeNodeIds);
        });
        return [...new Set(route)].filter((id) => nodes.some((node) => node.id === id));
      }
      return topologicalRunOrder(nodes.map((node) => node.id));
    }

    function nodeFootprint(node) {
      if (!node) return { width: 264, height: 132 };
      if (node.type === 'loop-control') return { width: 288, height: 150 };
      if (node.type === 'content-sandbox') return { width: 300, height: 156 };
      return { width: 264, height: 132 };
    }

    function nodePortSide(node, portType) {
      if (node?.type === 'loop-control') {
        return portType === 'input' ? 'right' : 'left';
      }
      return portType === 'input' ? 'left' : 'right';
    }

    function nodePortPoint(node, portType) {
      const size = nodeFootprint(node);
      const side = nodePortSide(node, portType);
      return {
        x: side === 'left' ? node.x : node.x + size.width,
        y: node.y + 66,
      };
    }

    function loopEdgeIdsFor(loopNodeId, cycleNodeIds = []) {
      const executionSet = new Set([loopNodeId, ...cycleNodeIds]);
      const edgeIds = new Set();
      edges.forEach((edge) => {
        if (!executionSet.has(edge.from) || !executionSet.has(edge.to)) return;
        edgeIds.add(edge.id);
      });
      return edgeIds;
    }

    function renderEdges() {
      Array.from(edgeSvg.querySelectorAll('.edge-group')).forEach((group) => group.remove());
      edgeDeleteLayer.innerHTML = '';
      const loopEdgeIds = new Set();
      workflowLoopPlans().forEach((plan) => {
        loopEdgeIdsFor(plan.loopNode.id, plan.cycleNodeIds).forEach((edgeId) => loopEdgeIds.add(edgeId));
      });
      edges.forEach((edge) => {
        const from = nodes.find((node) => node.id === edge.from);
        const to = nodes.find((node) => node.id === edge.to);
        if (!from || !to) return;
        const fromPoint = nodePortPoint(from, 'output');
        const toPoint = nodePortPoint(to, 'input');
        const startX = fromPoint.x;
        const startY = fromPoint.y;
        const endX = toPoint.x;
        const endY = toPoint.y;
        const curve = Math.max(80, Math.abs(endX - startX) * 0.42);
        const d = `M ${startX} ${startY} C ${startX + curve} ${startY}, ${endX - curve} ${endY}, ${endX} ${endY}`;
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.setAttribute('class', 'edge-group');
        group.dataset.edgeId = edge.id;

        const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hitPath.setAttribute('class', 'edge-hit');
        hitPath.setAttribute('d', d);
        hitPath.setAttribute('fill', 'none');
        hitPath.setAttribute('stroke', 'transparent');
        hitPath.setAttribute('stroke-width', '18');
        hitPath.setAttribute('stroke-linecap', 'round');
        hitPath.addEventListener('pointerdown', (event) => event.stopPropagation());
        hitPath.addEventListener('click', (event) => {
          event.stopPropagation();
          selectEdge(edge.id);
        });
        group.appendChild(hitPath);

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', `edge-path ${loopEdgeIds.has(edge.id) ? 'loop-flow' : ''} ${selectedEdgeId === edge.id ? 'selected' : ''}`.trim());
        path.dataset.edgeId = edge.id;
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', loopEdgeIds.has(edge.id) ? '#db2777' : '#64748b');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('marker-end', 'url(#arrow)');
        group.appendChild(path);

        edgeSvg.appendChild(group);

        if (selectedEdgeId === edge.id) {
          const button = document.createElement('button');
          button.className = 'edge-delete-chip';
          button.type = 'button';
          button.textContent = '删除';
          button.style.left = `${(startX + endX) / 2 - 29}px`;
          button.style.top = `${(startY + endY) / 2 - 13}px`;
          button.addEventListener('pointerdown', (event) => event.stopPropagation());
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            deleteSelectedEdge();
          });
          edgeDeleteLayer.appendChild(button);
        }
      });
    }

    function renderNodes() {
      world.innerHTML = '';
      nodes.forEach((node) => {
        const definition = typeMap[node.type] || nodeTypes[0];
        const article = document.createElement('article');
        const isPrimarySelected = node.id === selectedNodeId;
        const isMultiSelected = selectedNodeIds.has(node.id);
        const status = computedNodeStatus(node);
        const connectionSource = connectFromNodeId ? nodes.find((item) => item.id === connectFromNodeId) : null;
        const inputValidation = connectionSource && connectionSource.id !== node.id
          ? validateConnection(connectionSource, node)
          : null;
        const inputPortClass = connectFromNodeId && connectFromNodeId !== node.id
          ? (inputValidation?.ok ? 'can-connect' : 'cannot-connect')
          : '';
        article.className = `node ${status} ${definition.scope === 'global' ? 'is-global' : ''} ${definition.scope === 'loop' ? 'is-loop' : ''} ${node.type === 'content-sandbox' ? 'is-sandbox' : ''} ${isPrimarySelected ? 'selected' : ''} ${isMultiSelected && !isPrimarySelected ? 'multi-selected' : ''}`;
        article.dataset.id = node.id;
        article.style.left = `${node.x}px`;
        article.style.top = `${node.y}px`;
        article.style.setProperty('--accent', definition.accent);
        article.innerHTML = `
          <header>
            <span class="node-icon">${nodeIconMarkup(definition.iconKey)}</span>
            <div><strong>${escapeHtml(node.title)}</strong><p>${definition.label}</p></div>
            <b>${statusLabels[status]}</b>
            <button class="node-menu-trigger ${isPrimarySelected && isNodePopoverOpen ? 'is-active' : ''}" type="button" aria-label="打开节点菜单">⋯</button>
          </header>
          <p>${escapeHtml(node.body)}</p>
          <footer>
            <span class="port-hit ${inputPortClass}" data-port="input" title="${inputValidation ? escapeAttr(inputValidation.ok ? `可连接：${fieldLabels(inputValidation.matched)}` : inputValidation.reason) : ''}"><i class="port"></i> input</span>
            <em>${escapeHtml(node.output)}</em>
            <span class="port-hit ${connectFromNodeId === node.id ? 'is-connecting' : ''}" data-port="output">output <i class="port"></i></span>
          </footer>
        `;
        article.addEventListener('pointerdown', (event) => beginNodeDrag(event, node));
        article.querySelectorAll('[data-port]').forEach((port) => {
          port.addEventListener('pointerdown', (event) => event.stopPropagation());
          port.addEventListener('click', (event) => {
            event.stopPropagation();
            handlePortClick(node.id, port.dataset.port);
          });
        });
        const trigger = article.querySelector('.node-menu-trigger');
        trigger.addEventListener('pointerdown', (event) => {
          event.stopPropagation();
        });
        trigger.addEventListener('click', (event) => {
          event.stopPropagation();
          openNodePopover(node.id);
        });
        world.appendChild(article);
      });
    }

    function renderRunStrip() {
      runStrip.innerHTML = '';
      if (!nodes.length) {
        const empty = document.createElement('span');
        empty.className = 'draft';
        empty.textContent = '空白项目：从左侧节点库开始添加';
        runStrip.appendChild(empty);
        return;
      }
      const order = projectExecutionStripOrder();
      if (!order.length) return;
      order.forEach((nodeId, index, list) => {
        const node = nodes.find((item) => item.id === nodeId);
        if (!node) return;
        const item = document.createElement('span');
        item.className = computedNodeStatus(node);
        item.textContent = node.title;
        runStrip.appendChild(item);
        if (index < list.length - 1) {
          const arrow = document.createElement('b');
          arrow.textContent = '→';
          arrow.style.color = 'rgba(15,23,42,.36)';
          runStrip.appendChild(arrow);
        }
      });
    }

    function renderInspector() {
      if (!isNodePopoverOpen) {
        nodePopover.hidden = true;
        return;
      }
      const node = nodes.find((item) => item.id === selectedNodeId) || nodes[0] || null;
      const enabled = Boolean(node);
      const multiCount = selectedNodeIds.size;
      const isMulti = multiCount > 1;
      const isRunning = Boolean(node && runningNodeIds.has(node.id));
      [nodeTitle, runNodeBtn, showOutputBtn].forEach((item) => {
        item.disabled = !enabled || isMulti || isRunning;
      });
      runNodeBtn.textContent = isRunning ? '执行中...' : '执行';
      deleteNodeBtn.disabled = !enabled || isRunning;
      deleteNodeBtn.textContent = isMulti ? `删除(${multiCount})` : '删除';
      const hasResult = Boolean(node && nodeOutputValue(node));
      showOutputBtn.hidden = !hasResult;
      showOutputBtn.disabled = !enabled || isMulti || !hasResult || isRunning;
      if (!node) {
        selectedId.textContent = '未选择';
        nodeTitle.value = '';
        nodeGuideText.textContent = '选择一个节点后配置参数，执行结果会统一显示在画布右侧，可编辑并保存给下游节点使用。';
        showOutputBtn.hidden = true;
        nodeSpecificSection.hidden = true;
        nodeSpecificFields.hidden = true;
        nodeSpecificFields.innerHTML = '';
        return;
      }
      selectedId.textContent = node.id;
      nodeTitle.value = node.title;
      const normalizedInput = normalizeNodeInput(node);
      node.input = normalizedInput;
      nodeGuideText.textContent = node.body || '配置参数后执行节点，结果会统一显示在画布右侧，可编辑并保存。';
      nodePopover.hidden = false;
      renderNodeSpecificFields(node);
      positionNodePopover();
    }

    function renderOutputPanel() {
      const node = nodes.find((item) => item.id === outputNodeId);
      const rawResult = node?.savedResult || nodeResults[node?.id] || null;
      const outputValue = ['material-package', 'tts', 'content-sandbox', 'video-recognition'].includes(node?.type)
        ? (rawResult || nodeOutputValue(node))
        : nodeOutputValue(node);
      const hasResult = Boolean(node && outputValue);
      if (!isOutputPaneOpen || !node || !hasResult) {
        nodeOutputPanel.hidden = true;
        nodeResultEditor.value = '';
        scriptOutputEditor.hidden = true;
        scriptOutputEditor.innerHTML = '';
        videoOutputEditor.hidden = true;
        videoOutputEditor.innerHTML = '';
        materialOutputEditor.hidden = true;
        materialOutputEditor.innerHTML = '';
        voiceOutputEditor.hidden = true;
        voiceOutputEditor.innerHTML = '';
        sandboxOutputEditor.hidden = true;
        sandboxOutputEditor.innerHTML = '';
        nodeOutputPanel.classList.remove('script-split-mode');
        renderedOutputNodeId = '';
        outputLastSavedText = '';
        outputDirty = false;
        selectedScriptGroupIndexes = new Set();
        return;
      }
      const isRunning = runningNodeIds.has(node.id);
      const previousOutputNodeId = renderedOutputNodeId;
      if (previousOutputNodeId && previousOutputNodeId !== node.id) {
        selectedScriptGroupIndexes = new Set();
        sandboxViewState = { sourceNodeId: '', page: 0 };
      }
      const shouldAnimate = nodeOutputPanel.hidden || previousOutputNodeId !== node.id;
      nodeOutputPanel.hidden = false;
      if (shouldAnimate) {
        nodeOutputPanel.classList.add('is-opening');
        window.setTimeout(() => nodeOutputPanel.classList.remove('is-opening'), 220);
      }
      renderedOutputNodeId = node.id;
      nodeOutputTitle.textContent = `${node.title} · 执行结果`;
      const savedText = stringifyOutput(outputValue);
      const contentChanged = savedText !== outputLastSavedText;
      const parsedOutputValue = parseMaybeJson(outputValue);
      const isScriptSplitResult = node.type === 'script-split' && isScriptSplitOutput(outputValue);
      const isVideoRecognitionResult = node.type === 'video-recognition' && (
        parsedOutputValue?.type === 'video-recognition-result'
        || node.savedResult?.type === 'video-recognition-result'
        || Boolean(outputValue)
      );
      const isMaterialPackageResult = node.type === 'material-package' && isMaterialPackageOutput(outputValue);
      const isVoicePackageResult = node.type === 'tts' && isVoicePackageOutput(outputValue);
      const isSandboxResult = node.type === 'content-sandbox' && isContentSandboxOutput(outputValue);
      nodeOutputPanel.classList.toggle('script-split-mode', isScriptSplitResult);
      scriptOutputEditor.hidden = !isScriptSplitResult;
      videoOutputEditor.hidden = !isVideoRecognitionResult;
      materialOutputEditor.hidden = !isMaterialPackageResult;
      voiceOutputEditor.hidden = !isVoicePackageResult;
      sandboxOutputEditor.hidden = !isSandboxResult;
      nodeResultEditor.hidden = isScriptSplitResult || isVideoRecognitionResult || isMaterialPackageResult || isVoicePackageResult || isSandboxResult;
      if (!isScriptSplitResult) {
        scriptOutputEditor.innerHTML = '';
        selectedScriptGroupIndexes = new Set();
      }
      if (!isVideoRecognitionResult) {
        videoOutputEditor.innerHTML = '';
      }
      if (!isMaterialPackageResult) {
        materialOutputEditor.innerHTML = '';
      }
      if (!isVoicePackageResult) {
        voiceOutputEditor.innerHTML = '';
      }
      if (!isSandboxResult) {
        sandboxOutputEditor.innerHTML = '';
      }
      if (document.activeElement !== nodeResultEditor || isRunning || previousOutputNodeId !== node.id) {
        nodeResultEditor.value = savedText;
        outputLastSavedText = savedText;
        outputDirty = false;
      }
      if (isScriptSplitResult && (previousOutputNodeId !== node.id || contentChanged || !scriptOutputEditor.innerHTML)) {
        renderScriptSplitOutputEditor(outputValue);
      }
      if (isVideoRecognitionResult && (previousOutputNodeId !== node.id || contentChanged || !videoOutputEditor.innerHTML)) {
        videoOutputEditor.innerHTML = renderVideoRecognitionOutput(node, outputValue);
      }
      if (isMaterialPackageResult && (previousOutputNodeId !== node.id || contentChanged || !materialOutputEditor.innerHTML)) {
        renderMaterialPackageOutput(outputValue);
      }
      if (isVoicePackageResult && (previousOutputNodeId !== node.id || contentChanged || !voiceOutputEditor.innerHTML)) {
        renderVoicePackageOutput(outputValue);
      }
      if (isSandboxResult && (previousOutputNodeId !== node.id || contentChanged || !sandboxOutputEditor.innerHTML)) {
        renderContentSandboxOutput(outputValue);
      }
      nodeResultEditor.readOnly = isRunning;
      regenNodeResultBtn.disabled = isRunning;
      updateOutputDirtyState();
      saveNodeResultBtn.hidden = isVideoRecognitionResult;
      regenNodeResultBtn.hidden = false;
      if (isVideoRecognitionResult) {
        saveNodeResultBtn.disabled = true;
        saveNodeResultBtn.textContent = '已归纳';
        nodeOutputMeta.textContent = isRunning ? '正在识别视频内容' : '已输出三段纯文字';
      }
      if (isMaterialPackageResult) {
        saveNodeResultBtn.disabled = true;
        saveNodeResultBtn.textContent = '已生成';
        nodeOutputMeta.textContent = isRunning ? '正在生成素材槽位' : '可按画面拖拽上传素材';
      }
      if (isVoicePackageResult) {
        saveNodeResultBtn.disabled = true;
        saveNodeResultBtn.textContent = '已生成';
        nodeOutputMeta.textContent = isRunning ? '正在生成语音' : '已生成，可传递给字幕和剪辑节点';
      }
      if (isSandboxResult) {
        saveNodeResultBtn.disabled = true;
        saveNodeResultBtn.textContent = '已归档';
        nodeOutputMeta.textContent = isRunning ? '正在归档上游结果' : '按前置节点查看完整产出';
      }
    }

    function renderAll() {
      snapshotCurrentProject();
      applyViewport();
      renderProjects();
      renderEdges();
      renderNodes();
      renderRunStrip();
      renderInspector();
      renderOutputPanel();
      renderSelectionBox();
      renderSelectionActions();
      renderExecutionTrace();
    }

    function openNodePopover(nodeId) {
      if (!nodeId) return;
      if (outputDirty && outputNodeId && outputNodeId !== nodeId) {
        closeOutputPanelWithGuard();
      }
      if (nodePopoverCloseTimer) {
        window.clearTimeout(nodePopoverCloseTimer);
        nodePopoverCloseTimer = null;
      }
      selectedNodeId = nodeId;
      selectedNodeIds = new Set([nodeId]);
      const node = nodes.find((item) => item.id === nodeId);
      if (nodeOutputValue(node)) {
        outputNodeId = nodeId;
        isOutputPaneOpen = true;
      } else {
        outputNodeId = '';
        renderedOutputNodeId = '';
        isOutputPaneOpen = false;
      }
      isNodePopoverOpen = true;
      nodePopover.hidden = false;
      nodePopover.classList.remove('is-closing');
      nodePopover.classList.add('is-open');
      renderAll();
    }

    function handlePortClick(nodeId, portType) {
      if (portType === 'output') {
        connectFromNodeId = connectFromNodeId === nodeId ? '' : nodeId;
        selectedEdgeId = '';
        const node = nodes.find((item) => item.id === nodeId);
        if (connectFromNodeId && node) {
          executionLogs.push(`${node.title}：请选择下游节点 input`);
          renderLogs();
        }
        renderNodes();
        return;
      }
      if (portType !== 'input' || !connectFromNodeId) return;
      if (connectFromNodeId === nodeId) {
        executionLogs.push('不能把节点连接到自己');
        connectFromNodeId = '';
        renderNodes();
        renderLogs();
        return;
      }
      const fromNode = nodes.find((item) => item.id === connectFromNodeId);
      const toNode = nodes.find((item) => item.id === nodeId);
      if (!fromNode || !toNode) {
        connectFromNodeId = '';
        renderNodes();
        return;
      }
      const validation = validateConnection(fromNode, toNode);
      if (!validation.ok) {
        executionLogs.push(`无法连接：${validation.reason}`);
        selectedEdgeId = '';
        renderNodes();
        renderLogs();
        return;
      }
      edges = edges.filter((edge) => !(edge.from === connectFromNodeId && edge.to === nodeId));
      edges.push({
        id: `${connectFromNodeId}-${nodeId}-${Date.now().toString(36)}`,
        from: connectFromNodeId,
        to: nodeId,
        createdAt: new Date().toISOString(),
        fields: validation.matched,
      });
      executionLogs.push(`${toNode.title}：已接入母节点 ${fromNode.title}（${fieldLabels(validation.matched)}）`);
      connectFromNodeId = '';
      selectedEdgeId = '';
      renderAll();
      renderLogs();
      persistProjects();
    }

    function selectEdge(edgeId) {
      connectFromNodeId = '';
      selectedEdgeId = selectedEdgeId === edgeId ? '' : edgeId;
      const edge = edges.find((item) => item.id === selectedEdgeId);
      if (edge) {
        const fromNode = nodes.find((item) => item.id === edge.from);
        const toNode = nodes.find((item) => item.id === edge.to);
        executionLogs.push(`已选中连线：${fromNode?.title || edge.from} → ${toNode?.title || edge.to}，按 Delete 可删除`);
        renderLogs();
      }
      renderEdges();
    }

    function deleteSelectedEdge() {
      if (!selectedEdgeId) return false;
      const edge = edges.find((item) => item.id === selectedEdgeId);
      if (!edge) {
        selectedEdgeId = '';
        return false;
      }
      const fromNode = nodes.find((item) => item.id === edge.from);
      const toNode = nodes.find((item) => item.id === edge.to);
      edges = edges.filter((item) => item.id !== selectedEdgeId);
      selectedEdgeId = '';
      executionLogs.push(`已取消连线：${fromNode?.title || edge.from} → ${toNode?.title || edge.to}`);
      renderAll();
      renderLogs();
      persistProjects();
      return true;
    }

    function nodeDefinitionFields(node, direction) {
      const definition = typeMap[node?.type] || {};
      const key = direction === 'input' ? 'inputFields' : 'outputFields';
      return Array.isArray(definition[key]) ? definition[key] : [];
    }

    function fieldLabels(fields = []) {
      return fields.map((field) => fieldRegistry[field] || field).join('、');
    }

    function resultOutputFields(result) {
      const parsed = parseMaybeJson(result);
      if (!parsed || typeof parsed !== 'object') return [];
      const fields = new Set();
      if (parsed.type === 'video-params-result') fields.add('videoParams');
      if (parsed.type === 'loop-control-result') {
        fields.add('loopContext');
        fields.add('*');
      }
      if (parsed.type === 'script-variation-result' || parsed.type === 'text-production-result') {
        fields.add('scriptText');
        return [...fields];
      }
      if (typeof parsed.scriptText === 'string' || parsed.payload?.scriptText) fields.add('scriptText');
      if (parsed.type === 'script-split-result') {
        fields.add('scriptStructure');
        fields.add('scriptSplitResult');
        fields.add('cleanScript');
        fields.add('visualGroups');
      }
      if (parsed.type === 'material-package-result') {
        fields.add('mediaPackage');
        fields.add('materialPackage');
      }
      if (parsed.type === 'seed-library-result') {
        fields.add('seedVideoUrl');
        fields.add('seedCosUrl');
        fields.add('txtScript');
      }
      if (parsed.type === 'voice-package-result') {
        fields.add('voicePackage');
        fields.add('audioUrl');
        fields.add('subtitles');
        fields.add('visualTimeline');
      }
      if (parsed.type === 'video-recognition-result') {
        fields.add('recognizedContent');
        if (parsed.payload?.scriptExtraction || parsed.scriptText) fields.add('scriptText');
        if (parsed.payload?.frameAnalysis) fields.add('frameAnalysis');
      }
      return [...fields];
    }

    function availableOutputFieldsForNode(node) {
      return [...new Set([
        ...nodeDefinitionFields(node, 'output'),
        ...resultOutputFields(node?.savedResult || nodeResults[node?.id] || null),
      ])];
    }

    function requiredInputFieldsForNode(node) {
      return nodeDefinitionFields(node, 'input');
    }

    function validateConnection(fromNode, toNode) {
      if (!fromNode || !toNode) {
        return { ok: false, reason: '节点不存在' };
      }
      const toDefinition = typeMap[toNode.type] || {};
      if (toNode.type === 'loop-control') {
        if (edges.some((edge) => edge.to === toNode.id && edge.from !== fromNode.id)) {
          return { ok: false, reason: '循环控制只能接收一个输入，避免环套环或多入口循环' };
        }
        return { ok: true, matched: ['loopTrigger'], reason: '连接到循环控制只作为下一轮触发信号，不传递上游内容' };
      }
      if (fromNode.type === 'loop-control') {
        return { ok: true, matched: ['loopContext'], reason: '循环控制会作为控制上下文贯穿下游流程' };
      }
      if (toDefinition.scope === 'global') {
        return { ok: false, reason: '全局节点只能作为上游参数，不接收普通节点输入' };
      }
      const required = requiredInputFieldsForNode(toNode);
      if (!required.length) {
        return { ok: false, reason: `${toNode.title} 不需要母节点输入` };
      }
      const available = availableOutputFieldsForNode(fromNode);
      const matched = required.filter((field) => available.includes(field) || available.includes('*') || field === '*');
      if (!matched.length) {
        return {
          ok: false,
          reason: `${fromNode.title} 输出字段（${fieldLabels(available) || '无'}）不能满足 ${toNode.title} 输入需求（${fieldLabels(required)}）`,
        };
      }
      return { ok: true, matched };
    }

    function createNodeDraft(type, overrides = {}) {
      const definition = typeMap[type] || nodeTypes[0];
      return {
        id: overrides.id || `${type}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
        type,
        title: overrides.title || definition.label,
        x: Number.isFinite(overrides.x) ? overrides.x : 460,
        y: Number.isFinite(overrides.y) ? overrides.y : 180,
        status: overrides.status || 'unconfigured',
        body: overrides.body || definition.description,
        output: overrides.output || `${type}.json`,
        input: overrides.input,
      };
    }

    function addNode(type, overrides = {}, options = {}) {
      const definition = typeMap[type] || nodeTypes[0];
      const offset = nodes.length * 22;
      const nextNode = createNodeDraft(type, {
        ...overrides,
        x: Number.isFinite(overrides.x) ? overrides.x : 460 + offset,
        y: Number.isFinite(overrides.y) ? overrides.y : 180 + offset,
        title: overrides.title || definition.label,
        body: overrides.body || definition.description,
      });
      nodes.push(nextNode);
      selectedNodeId = nextNode.id;
      if (options.render !== false) {
        renderAll();
      }
      if (options.persist !== false) {
        persistProjects();
      }
      return nextNode;
    }

    function connectNodes(fromId, toId, options = {}) {
      const fromNode = nodes.find((item) => item.id === fromId);
      const toNode = nodes.find((item) => item.id === toId);
      if (!fromNode || !toNode) {
        throw new Error(`连线失败：节点不存在 ${fromId} -> ${toId}`);
      }
      const validation = validateConnection(fromNode, toNode);
      if (!validation.ok) {
        throw new Error(`连线失败：${validation.reason}`);
      }
      edges = edges.filter((edge) => !(edge.from === fromId && edge.to === toId));
      edges.push({
        id: `${fromId}-${toId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 5)}`,
        from: fromId,
        to: toId,
        createdAt: new Date().toISOString(),
        fields: validation.matched,
      });
      if (options.render !== false) {
        renderAll();
      }
      if (options.persist !== false) {
        persistProjects();
      }
      return validation;
    }

    function beginNodeDrag(event, node) {
      event.preventDefault();
      event.stopPropagation();
      if (outputDirty && outputNodeId && outputNodeId !== node.id) {
        closeOutputPanelWithGuard();
      }
      if (event.shiftKey) {
        if (selectedNodeIds.has(node.id)) {
          selectedNodeIds = new Set([node.id]);
        } else {
          selectedNodeIds = new Set([...selectedNodeIds, node.id]);
        }
      } else {
        selectedNodeIds = new Set([node.id]);
      }
      selectedNodeId = node.id;
      if (nodeOutputValue(node)) {
        outputNodeId = node.id;
        isOutputPaneOpen = true;
      } else {
        outputNodeId = '';
        renderedOutputNodeId = '';
        isOutputPaneOpen = false;
      }
      dragState = {
        mode: 'node',
        nodeId: node.id,
        startClientX: event.clientX,
        startClientY: event.clientY,
        originX: node.x,
        originY: node.y,
      };
      renderAll();
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || event.target.closest('.node') || event.target.closest('.edge-delete-chip') || event.target.closest('.edge-group')) return;
      if (event.shiftKey) {
        const rect = canvas.getBoundingClientRect();
        dragState = {
          mode: 'box',
          startClientX: event.clientX,
          startClientY: event.clientY,
          canvasLeft: rect.left,
          canvasTop: rect.top,
          currentClientX: event.clientX,
          currentClientY: event.clientY,
        };
        selectionBox.hidden = false;
        updateSelectionBox(dragState);
        return;
      }
      connectFromNodeId = '';
      selectedEdgeId = '';
      selectedNodeIds = new Set();
      selectedNodeId = '';
      renderAll();
      dragState = {
        mode: 'pan',
        startClientX: event.clientX,
        startClientY: event.clientY,
        originX: viewport.x,
        originY: viewport.y,
      };
    });

    window.addEventListener('pointermove', (event) => {
      if (!dragState) return;
      const deltaX = event.clientX - dragState.startClientX;
      const deltaY = event.clientY - dragState.startClientY;
      if (dragState.mode === 'node') {
        nodes = nodes.map((node) => node.id === dragState.nodeId
          ? { ...node, x: Math.round(dragState.originX + deltaX / viewport.zoom), y: Math.round(dragState.originY + deltaY / viewport.zoom) }
          : node);
        renderEdges();
        renderNodes();
        renderRunStrip();
      } else if (dragState.mode === 'box') {
        dragState.currentClientX = event.clientX;
        dragState.currentClientY = event.clientY;
        updateSelectionBox(dragState);
      } else {
        viewport.x = dragState.originX + deltaX;
        viewport.y = dragState.originY + deltaY;
        applyViewport();
      }
    });

    window.addEventListener('pointerup', () => {
      if (dragState?.mode === 'box') {
        const selected = resolveSelectionBox(dragState);
        selectedNodeIds = new Set(selected);
        selectedNodeId = selected[0] || '';
        selectionBox.hidden = true;
        renderAll();
        persistProjects();
      } else if (dragState?.mode === 'node' || dragState?.mode === 'pan') {
        persistProjects();
      }
      dragState = null;
    });

    document.addEventListener('pointerdown', (event) => {
      const target = event.target;
      const isInteractiveSurface = nodePopover.contains(target)
        || nodeOutputPanel.contains(target)
        || target.closest('.node')
        || target.closest('.node-menu-trigger')
        || target.closest('.edge-delete-chip')
        || target.closest('.edge-group')
        || target.closest('.panel')
        || target.closest('.node-palette')
        || target.closest('.toolbar-actions');
      if (isInteractiveSurface) return;
      if (isNodePopoverOpen) closeNodePopover();
      if (isOutputPaneOpen) {
        closeOutputPanelWithGuard();
      }
    }, true);

    canvas.addEventListener('wheel', (event) => {
      if (!event.metaKey && !event.ctrlKey) return;
      event.preventDefault();
      viewport.zoom = Math.min(1.35, Math.max(0.46, Number((viewport.zoom - event.deltaY * 0.0012).toFixed(2))));
      applyViewport();
    }, { passive: false });

    function updateSelected(patch) {
      nodes = nodes.map((node) => node.id === selectedNodeId ? { ...node, ...patch } : node);
      if (selectedNodeIds.has(selectedNodeId)) {
        selectedNodeIds = new Set([selectedNodeId]);
      }
      renderEdges();
      renderNodes();
      renderRunStrip();
      persistProjects();
    }

    nodeTitle.addEventListener('input', (event) => updateSelected({ title: event.target.value }));

    function deleteSelectedNode() {
      const ids = selectedNodeIds.size > 1 ? [...selectedNodeIds] : (selectedNodeId ? [selectedNodeId] : []);
      if (ids.length === 0) return;
      const titles = nodes.filter((item) => ids.includes(item.id)).map((item) => item.title);
      if (!window.confirm(`删除 ${ids.length} 个节点：${titles.join('、')}？`)) return;
      nodes = nodes.filter((item) => !ids.includes(item.id));
      edges = edges.filter((edge) => !ids.includes(edge.from) && !ids.includes(edge.to));
      ids.forEach((id) => {
        delete nodeResults[id];
      });
      if (ids.includes(connectFromNodeId)) connectFromNodeId = '';
      if (ids.includes(outputNodeId)) {
        outputNodeId = '';
        isOutputPaneOpen = false;
      }
      selectedEdgeId = '';
      executionLogs.push(`批量删除：${titles.join('、')}`);
      const nextSelected = nodes.find((item) => item.id) || null;
      selectedNodeIds = nextSelected ? new Set([nextSelected.id]) : new Set();
      selectedNodeId = nextSelected ? nextSelected.id : '';
      closeNodePopover();
      renderAll();
      renderLogs();
      persistProjects();
    }

    deleteNodeBtn.addEventListener('click', deleteSelectedNode);
    deleteSelectionBtn.addEventListener('click', deleteSelectedNode);

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Delete' && !event.metaKey && !event.ctrlKey && !event.altKey) {
        if (deleteSelectedEdge()) return;
        deleteSelectedNode();
      }
    });

    function updateSelectionBox(state) {
      if (!state || state.mode !== 'box') return;
      const x1 = state.startClientX - state.canvasLeft;
      const y1 = state.startClientY - state.canvasTop;
      const x2 = state.currentClientX - state.canvasLeft;
      const y2 = state.currentClientY - state.canvasTop;
      const left = Math.min(x1, x2);
      const top = Math.min(y1, y2);
      const width = Math.abs(x2 - x1);
      const height = Math.abs(y2 - y1);
      selectionBox.style.left = `${left}px`;
      selectionBox.style.top = `${top}px`;
      selectionBox.style.width = `${width}px`;
      selectionBox.style.height = `${height}px`;
    }

    function renderSelectionBox() {
      if (!dragState || dragState.mode !== 'box') {
        selectionBox.hidden = true;
        return;
      }
      selectionBox.hidden = false;
      updateSelectionBox(dragState);
    }

    function selectedNodes() {
      return [...selectedNodeIds]
        .map((id) => nodes.find((node) => node.id === id))
        .filter(Boolean);
    }

    function renderSelectionActions() {
      const selected = selectedNodes();
      const hasSelection = selected.length >= 2 && dragState?.mode !== 'box';
      const isPartialSelection = hasSelection && selected.length < nodes.length;
      const isRunning = selected.some((node) => runningNodeIds.has(node.id));
      toolbarRunBtn.textContent = isPartialSelection ? '部分运行' : '运行';
      if (!hasSelection) {
        selectionActionLabel.hidden = true;
        deleteSelectionBtn.hidden = true;
        deleteSelectionBtn.disabled = false;
        return;
      }
      selectionActionLabel.textContent = `已选择 ${selected.length} 个节点`;
      selectionActionLabel.hidden = false;
      deleteSelectionBtn.hidden = false;
      deleteSelectionBtn.disabled = isRunning;
    }

    function positionNodePopover() {
      if (!isNodePopoverOpen || nodePopover.hidden) return;
      const selectedNode = world.querySelector(`.node[data-id="${selectedNodeId}"]`);
      if (!selectedNode || !canvasWrap) return;
      const nodeRect = selectedNode.getBoundingClientRect();
      const wrapRect = canvasWrap.getBoundingClientRect();
      const popRect = nodePopover.getBoundingClientRect();
      let left = nodeRect.right - wrapRect.left + 16;
      let top = nodeRect.top - wrapRect.top - 8;
      if (left + popRect.width > wrapRect.width - 12) {
        left = nodeRect.left - wrapRect.left - popRect.width - 16;
      }
      left = Math.max(12, Math.min(left, wrapRect.width - popRect.width - 12));
      top = Math.max(12, Math.min(top, wrapRect.height - popRect.height - 12));
      nodePopover.style.left = `${left}px`;
      nodePopover.style.top = `${top}px`;
    }

    function closeNodePopover() {
      if (!isNodePopoverOpen && nodePopover.hidden) return;
      if (nodePopoverCloseTimer) {
        window.clearTimeout(nodePopoverCloseTimer);
        nodePopoverCloseTimer = null;
      }
      isNodePopoverOpen = false;
      nodePopover.classList.remove('is-open');
      nodePopover.classList.add('is-closing');
      nodePopoverCloseTimer = window.setTimeout(() => {
        nodePopover.hidden = true;
        nodePopover.classList.remove('is-closing');
        nodePopoverCloseTimer = null;
      }, 180);
      renderAll();
    }

    function resolveSelectionBox(state) {
      if (!state || state.mode !== 'box') return [];
      const canvasRect = canvas.getBoundingClientRect();
      const x1 = Math.min(state.startClientX, state.currentClientX);
      const y1 = Math.min(state.startClientY, state.currentClientY);
      const x2 = Math.max(state.startClientX, state.currentClientX);
      const y2 = Math.max(state.startClientY, state.currentClientY);
      const worldLeft = (x1 - canvasRect.left - viewport.x) / viewport.zoom;
      const worldTop = (y1 - canvasRect.top - viewport.y) / viewport.zoom;
      const worldRight = (x2 - canvasRect.left - viewport.x) / viewport.zoom;
      const worldBottom = (y2 - canvasRect.top - viewport.y) / viewport.zoom;
      return nodes
        .filter((node) => overlaps(worldLeft, worldTop, worldRight, worldBottom, node.x, node.y, node.x + 264, node.y + 132))
        .map((node) => node.id);
    }

    function overlaps(ax1, ay1, ax2, ay2, bx1, by1, bx2, by2) {
      return ax1 <= bx2 && ax2 >= bx1 && ay1 <= by2 && ay2 >= by1;
    }

    function defaultNodeInput(node) {
      if (node.type === 'input') {
        return {
          briefText: '',
        };
      }
      if (node.type === 'video-params') {
        return {
          ratio: '4:3',
          targetDuration: '',
          materialPreference: '',
          visualStyle: '',
          requirement: '',
        };
      }
      if (node.type === 'seed-library') {
        return {
          seedId: '',
          seedPath: '',
          seedName: '',
          seedVideoUrl: '',
          seedVideoKey: '',
          seedCosUrl: '',
          seedSections: [],
          note: '选择一个种子内容文件夹，默认输出其原始视频。',
        };
      }
      if (node.type === 'loop-control') {
        return {
          count: 1,
          prompts: [''],
        };
      }
      if (node.type === 'script') {
        return {
          script: '',
          splitRule: '以句号为核心分隔，结合主谓宾和视觉主体判断是否合并。',
        };
      }
      if (node.type === 'caption') {
        return {
          color: '#FFFFFF',
          style: 'plain-white',
          emphasis: true,
        };
      }
      if (node.type === 'tts') {
        return {
          provider: 'minimax',
          voiceId: 'male-qn-jingying',
          speed: 1.08,
          emotion: '',
          pronunciationText: '717=七幺七',
        };
      }
      if (node.type === 'video-recognition') {
        return {
          provider: 'default',
          sourceType: 'url',
          videoUrl: '',
          seedVideoUrl: '',
          outputs: ['contentAnalysis', 'scriptExtraction', 'frameAnalysis'],
          note: '只接收公开视频 URL，优先使用上游种子内容库输出。',
        };
      }
      if (node.type === 'text-production') {
        return {
          content: '',
        };
      }
      if (node.type === 'script-split') {
        return {
          instruction: '提取纯净口播；先按内容主旨拆成粗粒度大段，再在大段内部按标点保留小句；只给整条脚本素材方向，不做逐段素材绑定。',
        };
      }
      if (node.type === 'material-package') {
        return {
          packageName: '素材包',
          ratio: '4:3',
          note: '实拍视频优先，每个画面文件夹放 1-3 个素材。',
        };
      }
      return { source: node.output, note: node.body };
    }

    function normalizeNodeInput(node) {
      const fallback = defaultNodeInput(node);
      if (!node.input || (typeof node.input === 'string' && !node.input.trim())) {
        return fallback;
      }
      if (node.type === 'video-recognition' && typeof node.input === 'object' && node.input !== null) {
        return sanitizeVideoRecognitionInput({
          ...fallback,
          ...node.input,
          videoUrl: String(node.input.videoUrl || node.input.seedVideoUrl || '').trim(),
          seedVideoUrl: String(node.input.seedVideoUrl || '').trim(),
          sourceType: 'url',
        });
      }
      if (node.type === 'seed-library' && typeof node.input === 'object' && node.input !== null) {
        return {
          ...fallback,
          ...node.input,
          seedSections: Array.isArray(node.input.seedSections) ? node.input.seedSections : fallback.seedSections,
        };
      }
      if (node.type === 'video-params' && typeof node.input === 'object' && node.input !== null) {
        return {
          ...fallback,
          ...node.input,
          ratio: node.input.ratio ?? fallback.ratio,
          targetDuration: node.input.targetDuration ?? fallback.targetDuration,
          materialPreference: node.input.materialPreference ?? fallback.materialPreference,
          visualStyle: node.input.visualStyle ?? fallback.visualStyle,
          requirement: node.input.requirement ?? node.input.note ?? fallback.requirement,
        };
      }
      if (node.type === 'loop-control' && typeof node.input === 'object' && node.input !== null) {
        const count = Math.max(1, Math.min(12, Number(node.input.count || fallback.count || 1)));
        const rawPrompts = Array.isArray(node.input.prompts) ? node.input.prompts : [];
        return {
          ...fallback,
          ...node.input,
          count,
          prompts: Array.from({ length: count }, (_, index) => String(rawPrompts[index] || '')),
        };
      }

    function upstreamOutputsForNode(node) {

    function extractScriptTextFromResult(result) {

          .filter((edge) => edge.to === nodeId)
          .forEach((edge) => {

            walk(upstreamNode.id, depth + 1);

    function inheritedGlobalNodesForNode(node) {

    function buildTextProductionPayload(node, input) {
      const upstreamOutputs = upstreamOutputsForNode(node).filter((item) => item.output);

    function buildScriptSplitPayload(node, input) {

      if (!upstreamScripts.length) {

      const missing = upstreamScripts.filter((item) => !item.scriptText);
      if (missing.length) {
        throw new Error(`上游节点缺少纯净脚本字段 scriptText：${missing.map((item) => item.title).join('、')}。请重新执行文本生产节点。`);
      }
      return {
        scriptText: upstreamScripts.map((item) => item.scriptText).join('\n'),
        seedReferenceText: upstreamSeedDocs.map((item) => [
          `# ${item.title}`,
          item.txtScript,
        ].join('\n')).join('\n\n'),
        instruction: String(input.instruction || '').trim(),
        globalContext,
        upstreamIds: [
          ...upstreamScripts.map((item) => item.id),
          ...upstreamSeedDocs.map((item) => item.id),
        ],
      };
    }

    function buildMaterialPackagePayload(node, input) {
      const upstreamResults = upstreamScriptSplitResultsForNode(node);
      const upstreamParams = upstreamVideoParamsForNode(node);
      const videoParams = upstreamParams[0]?.params || {};
      const seedContext = upstreamSeedContextForNode(node);
      if (!upstreamResults.length) {
        throw new Error('素材包生成缺少上游节点：请先连接脚本拆解节点');
      }
      const valid = upstreamResults.filter((item) => item.result && item.result.contentBlocks?.length);
      if (!valid.length) {
        throw new Error(`上游节点缺少脚本拆解结构：${upstreamResults.map((item) => item.title).join('、')}。请先执行并保存脚本拆解节点。`);
      }
      return {
        scriptSplitResult: valid[0].result,
        packageName: String(input.packageName || '素材包').trim(),
        ratio: String(input.ratio || videoParams.ratio || '4:3').trim(),
        note: [
          videoParams.targetDuration ? `目标时长：${videoParams.targetDuration}` : '',
          videoParams.materialPreference ? `素材要求：${videoParams.materialPreference}` : '',
          videoParams.visualStyle ? `画面风格：${videoParams.visualStyle}` : '',
          videoParams.requirement ? `补充需求：${videoParams.requirement}` : '',
          String(input.note || '').trim(),
        ].filter(Boolean).join('\n'),
        videoParams,
        seedContext,
        globalContext: globalContextForNode(node),
        upstreamIds: valid.map((item) => item.id),
      };
    }

    function normalizeTtsSpeechText(text) {
      return String(text || '')
        .replace(/717/g, '七幺七')
        .replace(/\s+/g, '')
        .trim();
    }

    function scriptTextFromScriptStructure(result) {
      const parsed = parseMaybeJson(result);
      if (!parsed || typeof parsed !== 'object') return '';
      const candidates = [
        parsed.cleanScript,
        parsed.scriptText,
        parsed.payload?.scriptText,
        parsed.payload?.cleanScript,
        parsed.handoffText,
      ];
      const direct = candidates.find((value) => typeof value === 'string' && value.trim());
      if (direct) return direct.trim();
      const blocks = Array.isArray(parsed.contentBlocks) ? parsed.contentBlocks : (Array.isArray(parsed.groups) ? parsed.groups : []);
      const fromBlocks = blocks.flatMap((block) => {
        if (typeof block === 'string') return [block];
        if (!block || typeof block !== 'object') return [];
        const units = Array.isArray(block.visualUnits) ? block.visualUnits : (Array.isArray(block.units) ? block.units : []);
        if (units.length) {
          return units.map((unit) => typeof unit === 'string' ? unit : (unit.text || unit.copy || unit.script || '')).filter(Boolean);
        }
        return [block.text || block.copy || block.script || ''].filter(Boolean);
      }).join('');
      return fromBlocks.trim();
    }

    function buildPronunciationDict(input) {
      return String(input.pronunciationText || '')
        .split(/[\n,，;；]+/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function buildTtsPayload(node, input) {
      const upstreamResults = upstreamScriptSplitResultsForNode(node);
      if (!upstreamResults.length) {
        throw new Error('语音生成缺少上游节点：请先连接脚本拆解节点');
      }
      const valid = upstreamResults
        .map((item) => ({ ...item, speechText: scriptTextFromScriptStructure(item.result) }))
        .filter((item) => item.result && item.speechText);
      if (!valid.length) {
        throw new Error(`上游节点没有可朗读脚本：${upstreamResults.map((item) => item.title).join('、')}。请先执行并保存脚本拆解节点。`);
      }
      const scriptSplitResult = valid[0].result;
      const text = normalizeTtsSpeechText(valid[0].speechText);
      if (!text) throw new Error('语音生成缺少可朗读脚本');
      return {
        title: `${node.title || '语音生成'}-${new Date().toLocaleDateString('zh-CN')}`,
        voiceId: ['Chinese (Mandarin)_Energetic_Bro', 'Chinese (Mandarin)_Unrestrained_Young_Man'].includes(input.voiceId)
          ? 'male-qn-jingying'
          : input.voiceId || 'male-qn-jingying',
        speed: Number(input.speed || 1),
        emotion: '',
        pronunciationDict: [],
        slices: [{ name: '完整口播', text }],
        handoff: {
          scriptSplitResult,
          globalContext: globalContextForNode(node),
          upstreamIds: valid.map((item) => item.id),
        },
      };
    }

    function buildVideoRenderPlanPayload(node, input) {
      const upstreamScripts = upstreamScriptSplitResultsForNode(node);
      const upstreamVoices = upstreamVoicePackagesForNode(node);
      const upstreamMaterials = upstreamMaterialPackagesForNode(node);
      const videoParamsList = upstreamVideoParamsForNode(node);
      const globalContext = globalContextForNode(node);
      const instruction = String(input.instruction || '').trim();
      if (!upstreamScripts.length) {
        throw new Error('剪辑缺少上游脚本结构：请先连接脚本拆解节点');
      }
      const validScripts = upstreamScripts.filter((item) => item.result && Array.isArray(item.result.contentBlocks) && item.result.contentBlocks.length);
      if (!validScripts.length) {
        throw new Error(`剪辑缺少可用脚本结构：${upstreamScripts.map((item) => item.title).join('、')}。请先执行并保存脚本拆解节点。`);
      }
      if (!upstreamVoices.length) {
        throw new Error('剪辑缺少上游语音包：请先连接语音生成节点');
      }
      const validVoices = upstreamVoices.filter((item) => item.result && Array.isArray(item.result.visualTimeline));
      if (!validVoices.length) {
        throw new Error(`剪辑缺少可用语音包：${upstreamVoices.map((item) => item.title).join('、')}。请先执行并保存语音生成节点。`);
      }
      const scriptResult = validScripts[0].result;
      const voiceResult = validVoices[0].result;
      const materialResult = upstreamMaterials.find((item) => item.result) || null;
      const videoParams = videoParamsList[0]?.params || globalContext.videoParams || {};
      const scriptBlocks = Array.isArray(scriptResult.contentBlocks) ? scriptResult.contentBlocks : [];
      const voiceTimeline = Array.isArray(voiceResult.visualTimeline) ? voiceResult.visualTimeline : [];
      const materialBlocks = materialResult?.result && Array.isArray(materialResult.result.blocks) ? materialResult.result.blocks : [];
      const scenes = scriptBlocks.map((block, index) => {
        const matchingVoice = voiceTimeline[index] || null;
        const matchingMaterial = materialBlocks[index] || null;
        return {
          id: block.id || `scene-${String(index + 1).padStart(3, '0')}`,
          order: index + 1,
          title: block.role || `主旨段 ${index + 1}`,
          scriptText: block.text || '',
          durationMs: matchingVoice?.endMs && matchingVoice?.startMs ? Math.max(0, Number(matchingVoice.endMs) - Number(matchingVoice.startMs)) : null,
          voiceSegment: matchingVoice ? {
            startMs: matchingVoice.startMs || 0,
            endMs: matchingVoice.endMs || 0,
            text: matchingVoice.text || '',
            blockRole: matchingVoice.blockRole || '',
          } : null,
          materialSlot: matchingMaterial ? {
            order: matchingMaterial.order || index + 1,
            folderName: matchingMaterial.folderName || '',
            items: Array.isArray(matchingMaterial.items) ? matchingMaterial.items.map((item) => ({
              order: item.order || 1,
              folderName: item.folderName || '',
              brief: item.materialBrief || item.text || '',
            })) : [],
          } : null,
        };
      });
      return {
        title: `${node.title || 'Remotion 剪辑'}-${new Date().toLocaleDateString('zh-CN')}`,
        ratio: String(input.ratio || videoParams.ratio || '16:9').trim(),
        instruction,
        globalContext,
        upstreamIds: [
          ...validScripts.map((item) => item.id),
          ...validVoices.map((item) => item.id),
          ...(materialResult ? [materialResult.id] : []),
        ],
        scriptStructure: scriptResult,
        voicePackage: voiceResult,
        materialPackage: materialResult?.result || null,
        scenes,
        tracks: {
          voice: voiceTimeline,
          materials: materialResult?.result?.blocks || [],
        },
        summary: {
          sceneCount: scenes.length,
          voiceDurationMs: Number(voiceResult.durationMs || 0),
          materialCount: Array.isArray(materialResult?.result?.blocks) ? materialResult.result.blocks.length : 0,
          ratio: String(input.ratio || videoParams.ratio || '16:9').trim(),
        },
      };
    }

    function buildReviewPayload(node, input) {
      const upstreamPlans = upstreamVideoRenderPlansForNode(node);
      const upstreamVoices = upstreamVoicePackagesForNode(node);
      const upstreamMaterials = upstreamMaterialPackagesForNode(node);
      const renderPlan = upstreamPlans.find((item) => item.result) || null;
      if (!renderPlan?.result) {
        throw new Error('审核导出缺少剪辑方案：请先连接 Remotion 剪辑节点');
      }
      const plan = renderPlan.result;
      const issues = [];
      if (!plan.ratio) issues.push('缺少视频比例');
      if (!plan.scenes?.length) issues.push('缺少画面场景');
      if (!upstreamVoices.length) issues.push('缺少语音包');
      if (!upstreamMaterials.length) issues.push('缺少素材包');
      return {
        ok: true,
        type: 'review-result',
        plan,
        summary: {
          issues,
          passed: issues.length === 0,
          voiceCount: upstreamVoices.length,
          materialCount: upstreamMaterials.length,
          sceneCount: Array.isArray(plan.scenes) ? plan.scenes.length : 0,
        },
        note: String(input.note || '').trim(),
        reviewItems: [
          {
            label: '视频比例',
            status: plan.ratio ? 'pass' : 'warn',
            detail: plan.ratio || '未配置',
          },
          {
            label: '语音包',
            status: upstreamVoices.length ? 'pass' : 'warn',
            detail: upstreamVoices.length ? upstreamVoices.map((item) => item.title).join('、') : '未连接',
          },
          {
            label: '素材包',
            status: upstreamMaterials.length ? 'pass' : 'warn',
            detail: upstreamMaterials.length ? upstreamMaterials.map((item) => item.title).join('、') : '未连接',
          },
          {
            label: '场景数量',
            status: plan.scenes?.length ? 'pass' : 'warn',
            detail: `${plan.scenes?.length || 0} 个`,
          },
        ],
        exportHint: issues.length ? '先补全问题后再导出' : '可导出交付',
      };
    }

    function upstreamVideoRenderPlansForNode(node) {
      if (!node) return [];
      return edges
        .filter((edge) => edge.to === node.id)
        .map((edge, index) => {
          const upstreamNode = nodes.find((item) => item.id === edge.from);
          if (!upstreamNode) return null;
          const rawResult = upstreamNode.savedResult || nodeResults[upstreamNode.id] || null;
          if (!isFreshForActiveLoop(rawResult)) return null;
          const parsed = parseMaybeJson(rawResult);
          if (!parsed || typeof parsed !== 'object' || parsed.type !== 'video-render-plan-result') return null;
          return {
            order: index + 1,
            id: upstreamNode.id,
            title: upstreamNode.title,
            result: parsed,
          };
        })
        .filter(Boolean);
    }

    function nodeStageLabel(type) {
      const definition = typeMap[type] || {};
      return definition.label || type || '未知节点';
    }

    function sandboxItemAmount(result) {
      const parsed = parseMaybeJson(result);
      if (!parsed || typeof parsed !== 'object') return `${String(result || '').length} 字符`;
      if (parsed.type === 'script-variation-result' || parsed.type === 'text-production-result') {
        return `${extractScriptTextFromResult(parsed).length} 字脚本`;
      }
      if (parsed.type === 'script-split-result') {
        const groups = Array.isArray(parsed.groups) ? parsed.groups : [];
        const units = groups.reduce((sum, group) => sum + (Array.isArray(group.visualUnits) ? group.visualUnits.length : 0), 0);
        return `${groups.length} 个主旨段 / ${units} 个画面`;
      }
      if (parsed.type === 'voice-package-result') {
        return `${formatDurationMs(parsed.durationMs || 0)} / ${Array.isArray(parsed.subtitles) ? parsed.subtitles.length : 0} 条字幕`;
      }
      if (parsed.type === 'material-package-result') {
        const blocks = Array.isArray(parsed.blocks) ? parsed.blocks : [];
        const units = blocks.reduce((sum, block) => sum + (Array.isArray(block.items) ? block.items.length : 0), 0);
        return `${blocks.length} 个主旨文件夹 / ${units} 个画面槽`;
      }
      if (parsed.type === 'video-params-result') return '视频参数';
      if (parsed.type === 'loop-control-result') return `${parsed.payload?.count || parsed.count || 1} 轮循环`;
      return `${Object.keys(parsed).length} 个字段`;
    }

    function buildContentSandboxResult(node) {
      const upstreamOutputs = edges
        .filter((edge) => edge.to === node.id)
        .map((edge, index) => {
          const upstreamNode = nodes.find((nodeItem) => nodeItem.id === edge.from);
          if (!upstreamNode) return null;
          const rawResult = upstreamNode.savedResult || nodeResults[upstreamNode.id] || nodeOutputValue(upstreamNode) || null;
          const output = nodeOutputValue(upstreamNode);
          return {
            edgeId: edge.id,
            order: index + 1,
            id: upstreamNode.id,
            title: upstreamNode.title,
            type: upstreamNode.type,
            rawResult,
            output: output ? stringifyOutput(output) : '',
          };
        })
        .filter((item) => item && (item.rawResult || item.output));
      if (!upstreamOutputs.length) {
        throw new Error('内容沙盒缺少上游结果：请先连接并执行至少一个前置节点');
      }
      const archiveBase = parseMaybeJson(node.input?.sandboxArchiveBase || null);
      const baseItems = archiveBase && archiveBase.type === 'content-sandbox-result' && Array.isArray(archiveBase.items)
        ? archiveBase.items
        : [];
      const loopInfo = activeLoopRunContext
        ? {
            iteration: activeLoopRunContext.iteration,
            count: activeLoopRunContext.count,
            prompt: activeLoopRunContext.prompt,
            promptText: activeLoopRunContext.prompt || '自动裂变',
          }
        : null;
      const items = upstreamOutputs.map((item, index) => {
        const sourceNode = nodes.find((nodeItem) => nodeItem.id === item.id);
        const result = item.rawResult || item.output;
        return {
          id: `${node.id}-sandbox-${Date.now().toString(36)}-${index + 1}`,
          order: baseItems.length + index + 1,
          loop: loopInfo,
          sourceNodeId: item.id,
          sourceNodeTitle: item.title,
          sourceNodeType: item.type,
          stageLabel: nodeStageLabel(item.type),
          amount: sandboxItemAmount(result),
          outputText: displayOutputForNode(sourceNode, result),
          rawResult: result,
          savedAt: new Date().toISOString(),
        };
      });
      const allItems = [...baseItems, ...items];
      return {
        ok: true,
        type: 'content-sandbox-result',
        mode: 'contentSandbox',
        summary: {
          sourceCount: new Set(allItems.map((item) => item.sourceNodeId)).size,
          itemCount: allItems.length,
          loopContext: globalContextForNode(node).loopContext || null,
          latestLoop: loopInfo,
        },
        items: allItems,
        globalContext: globalContextForNode(node),
        savedAt: new Date().toISOString(),
      };
    }

    function refreshNodeInputFromParent(node) {
      const upstreamOutputs = upstreamOutputsForNode(node);
      const globalContext = globalContextForNode(node);
      const parentInputs = node.type === 'loop-control'
        ? []
        : upstreamOutputs.map((item) => ({
        parentNodeId: item.id,
        parentNodeTitle: item.title,
        edgeId: item.edgeId,
        order: item.order,
        output: item.output,
      }));
      const parentInput = parentInputs
        .filter((item) => item.output)
        .map((item) => `#${item.order} ${item.parentNodeTitle}（${item.parentNodeId}）\n${item.output}`)
        .join('\n\n');
      const inheritedFields = {};
      upstreamOutputs.forEach((item) => {
        const parsed = parseMaybeJson(item.rawResult);
        const payload = parsed && typeof parsed === 'object'
          ? (parsed.payload && typeof parsed.payload === 'object' ? parsed.payload : parsed)
          : null;
        if (!payload || typeof payload !== 'object') return;
        const matchedFields = Array.isArray(item.fields) ? item.fields : [];
        matchedFields.forEach((field) => {
          if (field === '*') return;
          if (payload[field] !== undefined && payload[field] !== null && payload[field] !== '') {
            inheritedFields[field] = payload[field];
          }
        });
      });
      const nextInput = {
        ...normalizeNodeInput(node),
        ...inheritedFields,
        parentInputs,
        parentNodeIds: parentInputs.map((item) => item.parentNodeId),
        parentNodeTitles: parentInputs.map((item) => item.parentNodeTitle),
        parentNodeId: parentInputs[0]?.parentNodeId || '',
        parentNodeTitle: parentInputs[0]?.parentNodeTitle || '',
        parentInput,
        globalContext,
        parentInputUpdatedAt: new Date().toISOString(),
      };
      nodes = nodes.map((item) => item.id === node.id ? { ...item, input: nextInput } : item);
      return { ...node, input: nextInput };
    }

    function renderNodeSpecificFields(node) {
      if (!node || !['input', 'video-params', 'seed-library', 'loop-control', 'video-recognition', 'text-production', 'script-split', 'material-package', 'tts', 'edit', 'review'].includes(node.type)) {
        nodeSpecificSection.hidden = true;
        nodeSpecificFields.hidden = true;
        nodeSpecificFields.innerHTML = '';
        return;
      }
      if (node.type === 'input') {
        renderInputFields(node);
        return;
      }
      if (node.type === 'text-production') {
        renderTextProductionFields(node);
        return;
      }
      if (node.type === 'video-params') {
        renderVideoParamsFields(node);
        return;
      }
      if (node.type === 'seed-library') {
        renderSeedLibraryFields(node);
        return;
      }
      if (node.type === 'loop-control') {
        renderLoopControlFields(node);
        return;
      }
      if (node.type === 'script-split') {
        renderScriptSplitFields(node);
        return;
      }
      if (node.type === 'material-package') {
        renderMaterialPackageFields(node);
        return;
      }
      if (node.type === 'tts') {
        renderTtsFields(node);
        return;
      }
      if (node.type === 'edit') {
        renderEditFields(node);
        return;
      }
      if (node.type === 'review') {
        renderReviewFields(node);
        return;
      }
    }

    async function loadSeedLibraryCatalog() {
      if (seedLibraryState.loading || seedLibraryState.loaded) return seedLibraryState;
      seedLibraryState = { ...seedLibraryState, loading: true, error: '' };
      renderAll();
      try {
        const response = await fetch(`${AI_SERVER_URL}/seed-library`);
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.ok === false) {
          throw new Error(result.error || result.message || `种子内容库读取失败：HTTP ${response.status}`);
        }
        seedLibraryState = {
          loading: false,
          loaded: true,
          error: '',
          seeds: Array.isArray(result.seeds) ? result.seeds : [],
        };
        const currentNode = nodes.find((item) => item.id === selectedNodeId);
        if (currentNode?.type === 'seed-library') {
          const currentInput = normalizeNodeInput(currentNode);
          if (!String(currentInput.seedId || currentInput.seedPath || '').trim() && seedLibraryState.seeds[0]) {
            const first = seedLibraryState.seeds[0];
            setSelectedNodeInput({
              ...currentInput,
              seedId: first.id,
              seedPath: first.path,
              seedName: first.name,
              seedSections: first.sections,
              seedVideoUrl: first.defaultVideo?.url || '',
              seedVideoKey: first.defaultVideo?.key || '',
              seedCosUrl: first.seedCosUrl || '',
            });
            return seedLibraryState;
          }
          renderNodeSpecificFields(currentNode);
        }
      } catch (error) {
        seedLibraryState = {
          loading: false,
          loaded: false,
          error: error.message || String(error),
          seeds: [],
        };
      }
      renderAll();
      return seedLibraryState;
    }

    function renderSeedLibraryFields(node) {
      const input = normalizeNodeInput(node);
      nodeSpecificSection.hidden = false;
      nodeSpecificTitle.textContent = '种子内容库';
      nodeSpecificTag.textContent = '特殊节点';
      nodeSpecificFields.hidden = false;

      const catalog = seedLibraryState;
      const selectedSeed = catalog.seeds.find((seed) => seed.id === input.seedId || seed.path === input.seedPath || seed.name === input.seedName) || catalog.seeds[0] || null;
      const sections = selectedSeed?.sections || [];
      const defaultVideo = selectedSeed?.defaultVideo || null;
      const sectionNames = sections.map((section) => section.name).filter(Boolean);

      nodeSpecificFields.innerHTML = `
        <div class="field-grid">
          <label>
            种子文件夹
            <select id="seedLibrarySelect" ${catalog.loading ? 'disabled' : ''}>
              <option value="">${catalog.loading ? '正在加载...' : '请选择种子内容'}</option>
              ${catalog.seeds.map((seed) => `<option value="${escapeAttr(seed.id)}" ${seed.id === selectedSeed?.id ? 'selected' : ''}>${escapeHtml(seed.name)}</option>`).join('')}
            </select>
          </label>
        </div>
        <div class="preview-card">
          <div class="helper">${catalog.loading ? '正在读取种子内容库...' : (catalog.error ? `读取失败：${catalog.error}` : `已读取 ${catalog.seeds.length} 个种子内容文件夹。`)}</div>
          ${selectedSeed ? `
            <div class="helper">默认原视频：${escapeHtml(defaultVideo?.name || '未找到原视频')}</div>
            <div class="helper">种子目录：${escapeHtml(selectedSeed.seedCosUrl || selectedSeed.path || '')}</div>
            <div class="helper">执行时会默认把这个原视频作为输出，供后续节点直接接收。</div>
          ` : ''}
        </div>
        <div class="seed-library-list">
          ${sectionNames.length ? sectionNames.map((name, index) => `
            <div class="seed-library-item">
              <b>${escapeHtml(name)}</b>
              <span>二级文件夹</span>
            </div>
          `).join('') : `<div class="helper">还没有读取到二级文件夹名称。</div>`}
        </div>
      `;

      const seedSelect = nodeSpecificFields.querySelector('#seedLibrarySelect');
      seedSelect?.addEventListener('change', () => {
        const nextSeed = seedLibraryState.seeds.find((seed) => seed.id === seedSelect.value) || null;
        const currentNode = nodes.find((item) => item.id === selectedNodeId) || node;
        const currentInput = normalizeNodeInput(currentNode);
        if (!nextSeed) {
          setSelectedNodeInput({
            ...currentInput,
            seedId: '',
            seedPath: '',
            seedName: '',
            seedSections: [],
            seedVideoUrl: '',
            seedVideoKey: '',
            seedCosUrl: '',
          });
          return;
        }
        setSelectedNodeInput({
          ...currentInput,
          seedId: nextSeed.id,
          seedPath: nextSeed.path,
          seedName: nextSeed.name,
          seedSections: nextSeed.sections,
          seedVideoUrl: nextSeed.defaultVideo?.url || '',
          seedVideoKey: nextSeed.defaultVideo?.key || '',
          seedCosUrl: nextSeed.seedCosUrl || '',
        });
      });

      if (!catalog.loaded && !catalog.loading) {
        loadSeedLibraryCatalog();
      }
    }

    function renderVideoRecognitionFields(node) {
      const input = normalizeNodeInput(node);
      nodeSpecificSection.hidden = false;
      nodeSpecificTitle.textContent = '识别配置';
      nodeSpecificTag.textContent = '视频识别';
      nodeSpecificFields.hidden = false;
      const currentVideoUrl = String(input.videoUrl || input.seedVideoUrl || '').trim();
      nodeSpecificFields.innerHTML = `
        <div class="field-grid">
          <label>

    function parseNodeInput(node) {
      const input = normalizeNodeInput(node);
      if (typeof input !== 'string') return input;
      const raw = input.trim();
      if (!raw) return {};
      try {
        return JSON.parse(raw);
      } catch {
        return { text: raw };
      }
    }

    async function callVideoRecognition(node, input) {
      const videoUrl = String(input.videoUrl || input.seedVideoUrl || '').trim();
      if (!videoUrl) {
        throw new Error('缺少视频输入：请粘贴公开视频 URL 或连接种子内容库');
      }
      const response = await fetch(`${AI_SERVER_URL}/ai/video-recognition`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sourceType: 'url',
          videoUrl,
          outputs: input.outputs || [],
        }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || result.ok === false) {
        throw new Error(result.error || result.message || `视频识别接口调用失败：HTTP ${response.status}`);
      }
      return result;
    }
