    async function executeNode(node) {
      const input = ['video-params', 'loop-control', 'video-recognition', 'text-production', 'script-split', 'material-package', 'tts'].includes(node.type) ? normalizeNodeInput(node) : parseNodeInput(node);
      if (node.type === 'input') {
        const briefText = String(input.briefText || input.content || input.topic || '').trim();
        return {
          ok: true,
          type: 'content-brief',
          payload: {
            briefText,
          },
          next: ['script', 'text-production'],
        };
      }
      if (node.type === 'video-params') {
        const payload = {
          ratio: input.ratio || '4:3',
        };
        if (String(input.targetDuration || '').trim()) payload.targetDuration = String(input.targetDuration).trim();
        if (String(input.materialPreference || '').trim()) payload.materialPreference = String(input.materialPreference).trim();
        if (String(input.visualStyle || '').trim()) payload.visualStyle = String(input.visualStyle).trim();
        if (String(input.requirement || '').trim()) payload.requirement = String(input.requirement).trim();
        if (activeLoopRunContext) {
          payload.loopIteration = activeLoopRunContext.iteration;
          payload.loopCount = activeLoopRunContext.count;
          payload.loopPrompt = activeLoopRunContext.prompt || '';
          payload.loopPromptText = activeLoopRunContext.prompt || '自动裂变';
          payload.requirement = [
            payload.requirement || '',
            `本轮循环要求：${payload.loopPromptText}`,
          ].filter(Boolean).join('\n');
          executionLogs.push(`视频参数：接入第 ${payload.loopIteration}/${payload.loopCount} 轮循环要求：${payload.loopPromptText}`);
        }
        return {
          ok: true,
          type: 'video-params-result',
          payload,
        };
      }
      if (node.type === 'seed-library') {
        const seedId = String(input.seedId || input.seedPath || input.seedName || '').trim();
        if (!seedId) {
          throw new Error('请先选择一个种子内容文件夹');
        }
        const response = await fetch(`${AI_SERVER_URL}/seed-library/resolve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seedId }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.ok === false) {
          throw new Error(result.error || result.message || `种子内容库执行失败：HTTP ${response.status}`);
        }
        return result;
      }
      if (node.type === 'loop-control') {
        const count = Math.max(1, Math.min(12, Number(input.count || 1)));
        const prompts = Array.from({ length: count }, (_, index) => String(input.prompts?.[index] || '').trim());
        return {
          ok: true,
          type: 'loop-control-result',
          payload: {
            count,
            prompts,
            mode: 'loop',
          },
        };
      }
      if (node.type === 'video-recognition') {
        return callVideoRecognition(node, input);
      }
      if (node.type === 'text-production') {
        return callTextProduction(node, input);
      }
      if (node.type === 'script-split') {
        return callScriptSplit(node, input);
      }
      if (node.type === 'material-package') {
        return callMaterialPackage(node, input);
      }
      if (node.type === 'tts') {
        return callTtsPackage(node, input);
      }
      if (node.type === 'edit') {
        return {
          ...buildVideoRenderPlanPayload(node, input),
          ok: true,
          type: 'video-render-plan-result',
        };
      }
      if (node.type === 'review') {
        return buildReviewPayload(node, input);
      }
      if (node.type === 'content-sandbox') {
        return buildContentSandboxResult(node);
      }
      if (node.type === 'script') {
        const source = String(input.script || input.text || input.parentInput || '');
        const segments = source.split(/[。！？!?]+/).map((text) => text.trim()).filter(Boolean);
        return {
          ok: true,
          type: 'timeline-beats',
          segments: segments.map((text, index) => ({
            id: `beat-${String(index + 1).padStart(2, '0')}`,
            text: `${text}。`,
            visualNeed: '待素材库反向核对',
            duration: null,
          })),
          rule: input.splitRule || '句号 + 主谓宾 + 视觉主体',
        };
      }
      if (node.type === 'caption') {
        return {
          ok: true,
          type: 'caption-style',
          style: input.style || 'plain-white',
          color: input.color || '#FFFFFF',
          emphasis: input.emphasis !== false,
          note: '字幕时间戳等待 TTS 真实时长返回后生成',
        };
      }
      return {
        ok: true,
        type: `${node.type}-module`,
        status: 'local-preview',
        message: '当前节点已完成输入输出结构测试，真实服务尚未接入。',
        input,
        parentInput: input.parentInput || '',
      };
    }

    function renderLogs() {
      logItems.innerHTML = executionLogs.slice(-6).reverse().map((item) => `
        <div class="log-item"><i></i><span>${escapeHtml(item)}</span></div>
      `).join('');
    }

    function renderExecutionTrace() {
      const total = executionTrace.length;
      const running = executionTrace.filter((item) => item.status === 'running').length;
      const failed = executionTrace.filter((item) => item.status === 'failed').length;
      traceSummary.textContent = total
        ? `${total} 条记录${running ? ` / ${running} 执行中` : ''}${failed ? ` / ${failed} 失败` : ''}`
        : '等待运行';
      if (!total) {
        traceList.innerHTML = '<div class="trace-empty">暂无执行记录。运行节点后，这里会按顺序显示每一步。</div>';
        return;
      }
      traceList.innerHTML = executionTrace.map((item, index) => {
        const loopText = item.loop
          ? `第 ${item.loop.iteration}/${item.loop.count} 轮${item.loop.promptText ? `｜${item.loop.promptText}` : ''}`
          : '单次执行';
        const parentText = item.parentNodeTitles?.length ? `上游：${item.parentNodeTitles.join('、')}` : '';
        const detail = [loopText, parentText, item.message || ''].filter(Boolean).join(' · ');
        const time = item.time ? new Date(item.time).toLocaleTimeString('zh-CN', { hour12: false }) : '';
        return `
          <div class="trace-item ${escapeAttr(item.status || 'info')} ${item.kind === 'loop' ? 'loop' : ''}">
            <span class="trace-index">${index + 1}</span>
            <div>
              <b>${escapeHtml(item.nodeTitle || item.title || item.nodeId || '工作流')}</b>
              <p>${escapeHtml(detail)}</p>
            </div>
            <span class="trace-status">${escapeHtml(item.statusLabel || item.status || '记录')}${time ? ` ${escapeHtml(time)}` : ''}</span>
          </div>
        `;
      }).join('');
      traceList.scrollTop = traceList.scrollHeight;
    }

    function pushExecutionTrace(entry) {
      executionTrace.push({
        id: `trace-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`,
        time: new Date().toISOString(),
        ...entry,
      });
      if (executionTrace.length > 500) executionTrace = executionTrace.slice(-500);
      renderExecutionTrace();
    }

    function confirmOverwriteNode(node, context = '重新执行') {
      if (!nodeOutputValue(node)) return true;
      return window.confirm(`${node.title} 内已存在执行结果。\n${context}会覆盖当前节点内保存的输出内容，是否继续？`);
    }

    function runNodeById(nodeId, options = {}) {
      let node = nodes.find((item) => item.id === selectedNodeId);
      if (nodeId) node = nodes.find((item) => item.id === nodeId);
      if (!node) return Promise.resolve(null);
      if (node.type === 'loop-control' && options.skipLoopExpansion !== true) {
        return runLoopFromNode(node.id);
      }
      const invalidUpstream = edges
        .filter((edge) => edge.to === node.id)
        .map((edge) => ({
          edge,
          fromNode: nodes.find((item) => item.id === edge.from),
          toNode: node,
        }))
        .map((item) => ({ ...item, validation: validateConnection(item.fromNode, item.toNode) }))
        .find((item) => !item.validation.ok);
      if (invalidUpstream) {
        executionLogs.push(`无法执行 ${node.title}：${invalidUpstream.validation.reason}`);
        pushExecutionTrace({
          kind: 'node',
          status: 'failed',
          statusLabel: '连线失败',
          nodeId: node.id,
          nodeTitle: node.title,
          message: invalidUpstream.validation.reason,
          loop: activeLoopRunContext ? { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' } : null,
        });
        renderLogs();
        persistProjects();
        return Promise.resolve({ ok: false, type: 'connection-error', message: invalidUpstream.validation.reason });
      }
      const pendingUpstream = node.type === 'loop-control'
        ? null
        : edges
          .filter((edge) => edge.to === node.id)
          .map((edge) => nodes.find((item) => item.id === edge.from))
          .filter((upstreamNode) => upstreamNode && !['global', 'loop'].includes((typeMap[upstreamNode.type] || {}).scope))
          .find((upstreamNode) => {
            const output = upstreamNode.savedResult || nodeResults[upstreamNode.id] || null;
            const parsed = parseMaybeJson(output);
            return !output || (parsed && typeof parsed === 'object' && parsed.type === 'node-running');
          });
      if (pendingUpstream) {
        const message = `${node.title} 等待上游节点 ${pendingUpstream.title} 完成后才能执行`;
        executionLogs.push(message);
        pushExecutionTrace({
          kind: 'node',
          status: 'skipped',
          statusLabel: '等待上游',
          nodeId: node.id,
          nodeTitle: node.title,
          message,
          parentNodeTitles: [pendingUpstream.title],
          loop: activeLoopRunContext ? { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' } : null,
        });
        renderLogs();
        persistProjects();
        return Promise.resolve({ ok: false, type: 'dependency-pending', message });
      }
      if (options.confirmOverwrite !== false && !confirmOverwriteNode(node)) {
        return Promise.resolve(null);
      }
      selectedNodeId = node.id;
      const preservedSelectionIds = Array.isArray(options.preserveSelectionIds) ? options.preserveSelectionIds : null;
      selectedNodeIds = preservedSelectionIds ? new Set(preservedSelectionIds) : new Set([node.id]);
      const sandboxArchiveBase = node.type === 'content-sandbox' && options.appendSandbox
        ? (node.savedResult || nodeResults[node.id] || null)
        : null;
      clearNodeGeneratedOutput(node.id);
      if (sandboxArchiveBase) {
        nodes = nodes.map((item) => item.id === node.id
          ? { ...item, input: { ...(item.input && typeof item.input === 'object' ? item.input : {}), sandboxArchiveBase } }
          : item);
      } else if (node.type === 'content-sandbox') {
        nodes = nodes.map((item) => {
          if (item.id !== node.id || !item.input || typeof item.input !== 'object') return item;
          const { sandboxArchiveBase: _sandboxArchiveBase, ...restInput } = item.input;
          return { ...item, input: restInput };
        });
      }
      if (node.type === 'text-production' && options.preserveCurrentConfig !== true) {
        clearTransientNodeConfig(node.id);
      }
      node = nodes.find((item) => item.id === node.id) || node;
      node = refreshNodeInputFromParent(node);
      runningNodeIds.add(node.id);
      nodes = nodes.map((item) => item.id === node.id ? { ...item, status: 'running' } : item);
      const runningResult = {
        ok: null,
        type: 'node-running',
        message: runningMessageForNode(node),
        startedAt: new Date().toISOString(),
        parentNodeId: node.input?.parentNodeId || '',
        parentNodeIds: node.input?.parentNodeIds || [],
        parentInputs: node.input?.parentInputs || [],
      };
      setNodeOutput(node.id, runningResult);
      outputNodeId = node.id;
      isOutputPaneOpen = true;
      executionLogs.push(`${node.title}：开始执行`);
      pushExecutionTrace({
        kind: 'node',
        status: 'running',
        statusLabel: '开始',
        nodeId: node.id,
        nodeTitle: node.title,
        parentNodeTitles: node.input?.parentNodeTitles || [],
        loop: activeLoopRunContext ? { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' } : null,
      });
      renderAll();
      renderLogs();
      persistProjects();
      return new Promise((resolve) => window.setTimeout(async () => {
        let result;
        try {
          result = await executeNode(node);
        } catch (error) {
          result = {
            ok: false,
            type: 'node-error',
            message: error.message || String(error),
            parentNodeId: node.input?.parentNodeId || '',
            parentNodeIds: node.input?.parentNodeIds || [],
            parentInputs: node.input?.parentInputs || [],
          };
        }
        result = {
          ...result,
          ...(activeLoopRunContext ? {
            loopRun: {
              runId: activeLoopRunContext.runId,
              loopNodeId: activeLoopRunContext.loopNodeId,
              iteration: activeLoopRunContext.iteration,
              count: activeLoopRunContext.count,
              prompt: activeLoopRunContext.prompt,
              promptText: activeLoopRunContext.prompt || '自动裂变',
            },
          } : {}),
          parentNodeId: node.input?.parentNodeId || '',
          parentNodeTitle: node.input?.parentNodeTitle || '',
          parentNodeIds: node.input?.parentNodeIds || [],
          parentNodeTitles: node.input?.parentNodeTitles || [],
          parentInputs: node.input?.parentInputs || [],
        };
        setNodeOutput(node.id, result);
        if (node.type === 'content-sandbox') {
          nodes = nodes.map((item) => {
            if (item.id !== node.id || !item.input || typeof item.input !== 'object') return item;
            const { sandboxArchiveBase: _sandboxArchiveBase, ...restInput } = item.input;
            return { ...item, input: restInput };
          });
        }
        if (result.ok && node.type === 'text-production') {
          clearTransientNodeConfig(node.id);
        }
        nodes = nodes.map((item) => item.id === node.id ? { ...item, status: result.ok ? 'done' : 'failed' } : item);
        runningNodeIds.delete(node.id);
        if (preservedSelectionIds) selectedNodeIds = new Set(preservedSelectionIds);
        executionLogs.push(`${node.title}：${result.ok ? '输出成功' : '执行失败'}`);
        pushExecutionTrace({
          kind: 'node',
          status: result.ok ? 'success' : 'failed',
          statusLabel: result.ok ? '成功' : '失败',
          nodeId: node.id,
          nodeTitle: node.title,
          parentNodeTitles: node.input?.parentNodeTitles || [],
          message: result.ok ? displayOutputForNode(node, result).slice(0, 120) : (result.message || result.error || '执行失败'),
          loop: activeLoopRunContext ? { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' } : null,
        });
        if (result.ok && activeLoopRunContext?.loopNodeId) {
          const isTriggerEdge = edges.some((edge) => edge.from === node.id && edge.to === activeLoopRunContext.loopNodeId);
          const isExpectedTrigger = Array.isArray(activeLoopRunContext.triggerNodeIds)
            && activeLoopRunContext.triggerNodeIds.includes(node.id);
          if (
            isTriggerEdge
            && isExpectedTrigger
            && Array.isArray(activeLoopRunContext.triggeredNodeIds)
            && !activeLoopRunContext.triggeredNodeIds.includes(node.id)
          ) {
            activeLoopRunContext.triggeredNodeIds.push(node.id);
            const loopNodeTitle = nodes.find((item) => item.id === activeLoopRunContext.loopNodeId)?.title || '循环控制';
            const triggerMessage = `循环触发：${node.title} 从执行中转为执行成功，触发下一轮`;
            executionLogs.push(triggerMessage);
            pushExecutionTrace({
              kind: 'loop',
              status: 'success',
              statusLabel: '触发',
              nodeId: activeLoopRunContext.loopNodeId,
              nodeTitle: loopNodeTitle,
              message: triggerMessage,
              loop: { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' },
            });
          }
        }
        isOutputPaneOpen = true;
        renderAll();
        renderLogs();
        persistProjects();
        resolve(result);
      }, 420));
    }

      return runNodeById(selectedNodeId);

    traceToggleBtn.addEventListener('click', () => {

    function runningMessageForNode(node) {
      if (node.type === 'video-recognition') return '正在调用视频理解模型，视频越长等待时间越久，请稍等...';
      if (node.type === 'loop-control') return '正在生成循环控制上下文，请稍等...';
      if (node.type === 'text-production') return '正在生成口播脚本，请稍等...';
      if (node.type === 'script-split') return '正在清洗口播脚本并拆分画面容器，请稍等...';
      if (node.type === 'material-package') return '正在生成素材槽位，请稍等...';
      if (node.type === 'tts') return '正在生成语音和 word 级字幕时间轴，请稍等...';
      if (node.type === 'edit') return '正在生成剪辑方案，请稍等...';
      if (node.type === 'review') return '正在审核剪辑方案，请稍等...';
      return '正在执行当前节点，请稍等...';
    }

    function nodeStableOrder(nodeIds) {
      const selectedSet = new Set(nodeIds);
      return [...nodeIds]
        .sort((a, b) => nodes.findIndex((node) => node.id === a) - nodes.findIndex((node) => node.id === b))
        .filter((id) => selectedSet.has(id));
    }

    function topologicalRunOrder(nodeIds) {
      const selectedIds = [...new Set(nodeIds)].filter((id) => nodes.some((node) => node.id === id));
      const selectedSet = new Set(selectedIds);
      const visualOrder = nodeStableOrder(selectedIds);
      const indegree = new Map(selectedIds.map((id) => [id, 0]));
      const children = new Map(selectedIds.map((id) => [id, []]));
      edges.forEach((edge) => {
        if (!selectedSet.has(edge.from) || !selectedSet.has(edge.to)) return;
        children.get(edge.from)?.push(edge.to);
        indegree.set(edge.to, (indegree.get(edge.to) || 0) + 1);
      });
      const queue = visualOrder.filter((id) => (indegree.get(id) || 0) === 0);
      const order = [];
      while (queue.length) {
        const id = queue.shift();
        order.push(id);
        (children.get(id) || []).forEach((childId) => {
          indegree.set(childId, (indegree.get(childId) || 0) - 1);
          if ((indegree.get(childId) || 0) === 0) {
            queue.push(childId);
            queue.sort((a, b) => visualOrder.indexOf(a) - visualOrder.indexOf(b));
          }
        });
      }
      const unresolved = visualOrder.filter((id) => !order.includes(id));
      return [...order, ...unresolved];
    }

    function selectedRunOrder() {
      return topologicalRunOrder([...selectedNodeIds]);
    }

    function downstreamRunOrderFrom(nodeId) {
      const reachable = new Set();
      const queue = [nodeId];
      while (queue.length) {
        const currentId = queue.shift();
        edges
          .filter((edge) => edge.from === currentId)
          .forEach((edge) => {
            if (edge.to === nodeId || reachable.has(edge.to)) return;
            reachable.add(edge.to);
            queue.push(edge.to);
          });
      }
      return topologicalRunOrder([...reachable]);
    }

    function loopCycleNodesFor(loopNodeId) {
      const visited = new Set();
      const cycleNodes = new Set();
      const walk = (currentId, path = []) => {
        if (path.length > nodes.length + 1) return;
        edges
          .filter((edge) => edge.from === currentId)
          .forEach((edge) => {
            if (edge.to === loopNodeId) {
              path.forEach((id) => cycleNodes.add(id));
              cycleNodes.add(currentId);
              return;
            }
            const key = `${currentId}->${edge.to}`;
            if (visited.has(key)) return;
            visited.add(key);
            walk(edge.to, [...path, edge.to]);
          });
      };
      walk(loopNodeId, []);
      cycleNodes.delete(loopNodeId);
      return [...cycleNodes].filter((id) => nodes.some((node) => node.id === id));
    }

    function orderedOutgoingEdges(fromNodeId, stopNodeId = null) {
      return edges
        .filter((edge) => edge.from === fromNodeId)
        .filter((edge) => edge.to !== fromNodeId)
        .filter((edge) => stopNodeId ? edge.to !== stopNodeId || fromNodeId === stopNodeId : true)
        .map((edge) => {
          const nextNode = nodes.find((node) => node.id === edge.to);
          return nextNode ? { edge, nextNode } : null;
        })
        .filter(Boolean);
    }

    function executionRouteFrom(startNodeId, stopNodeId = null) {
      const route = [];
      const visited = new Set([startNodeId]);
      const walk = (currentId) => {
        for (const { nextNode } of orderedOutgoingEdges(currentId, stopNodeId)) {
          if (!nextNode) continue;
          if (nextNode.id === stopNodeId) return true;
          if (visited.has(nextNode.id)) continue;
          visited.add(nextNode.id);
          route.push(nextNode.id);
          if (walk(nextNode.id)) return true;
        }
        return false;
      };
      walk(startNodeId);
      return route.filter((id, index, list) => nodes.some((node) => node.id === id) && list.indexOf(id) === index);
    }

    function loopExecutionNodesFor(loopNodeId) {
      return executionRouteFrom(loopNodeId, loopNodeId);
    }

    function workflowLoopPlans() {
      return nodes
        .filter((node) => node.type === 'loop-control')
        .map((loopNode) => ({
          loopNode,
          cycleNodeIds: loopCycleNodesFor(loopNode.id),
          routeNodeIds: loopExecutionNodesFor(loopNode.id),
        }))
        .filter((plan) => plan.routeNodeIds.length);
    }

    function loopTriggerNodesFor(loopNodeId) {
      return edges
        .filter((edge) => edge.to === loopNodeId)
        .map((edge) => nodes.find((node) => node.id === edge.from))
        .filter(Boolean);
    }

    function validateLoopPlans(plans) {
      for (const plan of plans) {
        const inputCount = edges.filter((edge) => edge.to === plan.loopNode.id).length;
        if (inputCount > 1) {
          return { ok: false, reason: `${plan.loopNode.title} 有 ${inputCount} 个输入。循环控制只能有一个输入。` };
        }
        const nestedLoop = plan.cycleNodeIds
          .map((id) => nodes.find((node) => node.id === id))
          .find((node) => node?.type === 'loop-control');
        if (nestedLoop) {
          return { ok: false, reason: `${plan.loopNode.title} 的闭环中包含另一个循环控件 ${nestedLoop.title}，暂不允许环套环。` };
        }
      }
      return { ok: true };
    }

    async function runLoopFromNode(loopNodeId, options = {}) {
      const loopNode = nodes.find((node) => node.id === loopNodeId);
      if (!loopNode) return null;
      const loopInput = normalizeNodeInput(loopNode);
      const count = Math.max(1, Math.min(12, Number(loopInput.count || 1)));
      const prompts = Array.from({ length: count }, (_, index) => String(loopInput.prompts?.[index] || '').trim());
      const downstreamOrder = options.routeNodeIds?.length
        ? [...options.routeNodeIds]
        : executionRouteFrom(loopNode.id, loopNode.id);
      const triggerNodes = loopTriggerNodesFor(loopNode.id);
      if (!downstreamOrder.length) {
        executionLogs.push('循环控制没有连接下游节点');
        renderLogs();
        persistProjects();
        return { ok: false, type: 'loop-error', message: '循环控制没有连接下游节点' };
      }
      const downstreamNodes = downstreamOrder.map((id) => nodes.find((node) => node.id === id)).filter(Boolean);
      const nodesWithOutput = [loopNode, ...downstreamNodes].filter((node) => nodeOutputValue(node));
      if (nodesWithOutput.length) {
        executionLogs.push(`检测到循环链路已有 ${nodesWithOutput.length} 个节点结果，本次循环将按轮重建输出`);
      }
      selectedNodeIds = new Set([loopNode.id, ...downstreamOrder]);
      downstreamNodes
        .filter((node) => node.type === 'content-sandbox')
        .forEach((node) => clearNodeGeneratedOutput(node.id));
      executionLogs.push(`开始循环执行：${loopNode.title}，共 ${count} 轮`);
      executionLogs.push(`循环链路顺序：${[loopNode.id, ...downstreamOrder].map((id) => nodes.find((node) => node.id === id)?.title || id).join(' → ')}`);
      if (triggerNodes.length) executionLogs.push(`循环触发节点：${triggerNodes.map((node) => node.title).join('、')}`);
      pushExecutionTrace({
        kind: 'loop',
        status: 'running',
        statusLabel: '循环开始',
        nodeId: loopNode.id,
        nodeTitle: loopNode.title,
        message: `共 ${count} 轮｜${downstreamOrder.map((id) => nodes.find((node) => node.id === id)?.title || id).join(' → ')}${triggerNodes.length ? `｜触发：${triggerNodes.map((node) => node.title).join('、')}` : ''}`,
      });
      renderLogs();
      const loopResult = await runNodeById(loopNode.id, { confirmOverwrite: false, preserveSelectionIds: [...selectedNodeIds], skipLoopExpansion: true });
      if (!loopResult?.ok) return loopResult;
      const executionCountByNodeId = new Map([[loopNode.id, 1]]);
      const runId = `loop-run-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      for (let index = 0; index < count; index += 1) {
        activeLoopRunContext = {
          runId,
          loopNodeId: loopNode.id,
          iteration: index + 1,
          count,
          prompt: prompts[index] || '',
          triggerNodeIds: triggerNodes.map((node) => node.id),
          triggeredNodeIds: [],
        };
        downstreamNodes
          .filter((node) => node.type !== 'content-sandbox')
          .forEach((node) => clearNodeGeneratedOutput(node.id));
        executionLogs.push(`循环第 ${index + 1}/${count} 轮开始：${prompts[index] || '自动裂变'}`);
        pushExecutionTrace({
          kind: 'loop',
          status: 'running',
          statusLabel: '轮次开始',
          nodeId: loopNode.id,
          nodeTitle: loopNode.title,
          message: prompts[index] || '自动裂变',
          loop: { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' },
        });
        renderLogs();
        for (const nodeId of downstreamOrder) {
          const node = nodes.find((item) => item.id === nodeId);
          if (!node) continue;
          executionCountByNodeId.set(node.id, (executionCountByNodeId.get(node.id) || 0) + 1);
          const result = await runNodeById(nodeId, {
            confirmOverwrite: false,
            preserveSelectionIds: [...selectedNodeIds],
            appendSandbox: node?.type === 'content-sandbox',
          });
          if (result === null || result?.ok === false) {
            executionLogs.push(`循环执行中断统计：${[...executionCountByNodeId.entries()].map(([countNodeId, nodeCount]) => {
              const countNode = nodes.find((item) => item.id === countNodeId);
              return `${countNode?.title || countNodeId} ×${nodeCount}`;
            }).join('、')}`);
            renderLogs();
            persistProjects();
            activeLoopRunContext = null;
            return result;
          }
        }
        if (triggerNodes.length && !activeLoopRunContext.triggeredNodeIds.length) {
          const message = `第 ${index + 1}/${count} 轮没有收到循环触发信号：需要 ${triggerNodes.map((node) => node.title).join('、')} 从执行中转为执行成功`;
          executionLogs.push(message);
          pushExecutionTrace({
            kind: 'loop',
            status: 'failed',
            statusLabel: '未触发',
            nodeId: loopNode.id,
            nodeTitle: loopNode.title,
            message,
            loop: { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' },
          });
          renderLogs();
          persistProjects();
          activeLoopRunContext = null;
          return { ok: false, type: 'loop-trigger-missing', message };
        }
        executionLogs.push(`循环第 ${index + 1}/${count} 轮完成`);
        pushExecutionTrace({
          kind: 'loop',
          status: 'success',
          statusLabel: '轮次完成',
          nodeId: loopNode.id,
          nodeTitle: loopNode.title,
          loop: { ...activeLoopRunContext, promptText: activeLoopRunContext.prompt || '自动裂变' },
        });
        renderLogs();
      }
      activeLoopRunContext = null;
      executionLogs.push(`循环执行完成：共 ${count} 轮`);
      executionLogs.push(`循环执行统计：${[...executionCountByNodeId.entries()].map(([nodeId, nodeCount]) => {
        const node = nodes.find((item) => item.id === nodeId);
        return `${node?.title || nodeId} ×${nodeCount}`;
      }).join('、')}`);
      pushExecutionTrace({
        kind: 'loop',
        status: 'success',
        statusLabel: '循环完成',
        nodeId: loopNode.id,
        nodeTitle: loopNode.title,
        message: `共 ${count} 轮`,
      });
      renderAll();
      renderLogs();
      persistProjects();
      return { ok: true, type: 'loop-run-result', count };
    }

    async function runSelectedNodes() {
      const order = selectedRunOrder();
      if (order.length < 2) {
        executionLogs.push('请先用 Shift 框选两个或以上节点');
        renderLogs();
        persistProjects();
        return;
      }
      const nodesToRun = order.map((id) => nodes.find((node) => node.id === id)).filter(Boolean);
      const nodesWithOutput = nodesToRun.filter((node) => nodeOutputValue(node));
      if (nodesWithOutput.length) {
        const names = nodesWithOutput.map((node) => node.title).join('、');
        const confirmed = window.confirm(`选区中有 ${nodesWithOutput.length} 个节点已存在执行结果：${names}。\n运行选中节点会覆盖这些输出，是否继续？`);
        if (!confirmed) {
          executionLogs.push('已取消选区运行：用户保留现有节点输出');
          renderLogs();
          persistProjects();
          return;
        }
      }
      const preservedSelectionIds = [...selectedNodeIds];
      executionLogs.push(`开始运行选区：${nodesToRun.map((node) => node.title).join(' → ')}`);
      pushExecutionTrace({
        kind: 'workflow',
        status: 'running',
        statusLabel: '选区运行',
        nodeTitle: '选区运行',
        message: nodesToRun.map((node) => node.title).join(' → '),
      });
      renderLogs();
      for (const nodeId of order) {
        const result = await runNodeById(nodeId, { confirmOverwrite: false, preserveSelectionIds });
        if (result === null || result?.ok === false) break;
      }
      selectedNodeIds = new Set(preservedSelectionIds.filter((id) => nodes.some((node) => node.id === id)));
      selectedNodeId = order.find((id) => selectedNodeIds.has(id)) || '';
      executionLogs.push('选区运行结束');
      pushExecutionTrace({
        kind: 'workflow',
        status: 'success',
        statusLabel: '选区结束',
        nodeTitle: '选区运行',
      });
      renderAll();
      renderLogs();
      persistProjects();
    }

    document.getElementById('zoomOut').addEventListener('click', () => {

      applyViewport();

    document.getElementById('zoomIn').addEventListener('click', () => {

    async function markRun() {
      const loopPlans = workflowLoopPlans();
      if (loopPlans.length) {
        const loopValidation = validateLoopPlans(loopPlans);
        if (!loopValidation.ok) {
          executionLogs.push(`循环结构错误：${loopValidation.reason}`);
          pushExecutionTrace({
            kind: 'workflow',
            status: 'failed',
            statusLabel: '循环结构错误',
            nodeTitle: activeProject()?.name || '当前项目',
            message: loopValidation.reason,
          });
          renderLogs();
          persistProjects();
          return;
        }
        executionLogs.push(`检测到 ${loopPlans.length} 个闭环循环空间，本次运行从循环控件入口开始：${loopPlans.map((plan) => plan.loopNode.title).join('、')}`);
        pushExecutionTrace({
          kind: 'workflow',
          status: 'running',
          statusLabel: '循环入口',
          nodeTitle: activeProject()?.name || '当前项目',
          message: `从循环控件入口开始：${loopPlans.map((plan) => `${plan.loopNode.title}（${plan.cycleNodeIds.length} 个节点）`).join('、')}`,
        });
        renderLogs();
        for (const plan of loopPlans) {
          const result = await runLoopFromNode(plan.loopNode.id, { routeNodeIds: plan.routeNodeIds });
          if (result === null || result?.ok === false) {
            executionLogs.push('当前项目运行中断：循环执行失败');
            pushExecutionTrace({
              kind: 'workflow',
              status: 'failed',
              statusLabel: '项目中断',
              nodeTitle: activeProject()?.name || '当前项目',
              message: result?.message || '循环执行失败',
            });
            renderLogs();
            persistProjects();
            return;
          }
        }
        executionLogs.push('当前项目运行结束：循环空间执行完成');
        pushExecutionTrace({
          kind: 'workflow',
          status: 'success',
          statusLabel: '项目结束',
          nodeTitle: activeProject()?.name || '当前项目',
          message: '循环空间执行完成',
        });
        renderAll();
        renderLogs();
        persistProjects();
        return;
      }
      const order = topologicalRunOrder(nodes.map((node) => node.id));
      if (!order.length) {
        executionLogs.push('当前项目还没有节点，请先从节点库添加节点');
        renderLogs();
        persistProjects();
        return;
      }
      const nodesWithOutput = nodes.filter((node) => nodeOutputValue(node));
      if (nodesWithOutput.length) {
        const names = nodesWithOutput.map((node) => node.title).join('、');
        const confirmed = window.confirm(`当前工作流中有 ${nodesWithOutput.length} 个节点已存在执行结果：${names}。\n运行整个工作流会重新执行并覆盖这些节点内保存的输出内容，是否继续？`);
        if (!confirmed) {
          executionLogs.push('已取消工作流运行：用户保留现有节点输出');
          renderLogs();
          persistProjects();
          return;
        }
      }
      executionLogs.push(`开始运行当前项目：${activeProject()?.name || '未命名项目'}`);
      executionLogs.push(`执行顺序：${order.map((id) => nodes.find((node) => node.id === id)?.title || id).join(' → ')}`);
      pushExecutionTrace({
        kind: 'workflow',
        status: 'running',
        statusLabel: '项目运行',
        nodeTitle: activeProject()?.name || '当前项目',
        message: order.map((id) => nodes.find((node) => node.id === id)?.title || id).join(' → '),
      });
      renderLogs();
      const handledByLoop = new Set();
      for (const nodeId of order) {
        if (handledByLoop.has(nodeId)) {
          const skippedNode = nodes.find((node) => node.id === nodeId);
          executionLogs.push(`${skippedNode?.title || nodeId}：已由循环控件接管，跳过外层执行`);
          pushExecutionTrace({
            kind: 'node',
            status: 'skipped',
            statusLabel: '循环接管',
            nodeId,
            nodeTitle: skippedNode?.title || nodeId,
            message: '已由循环控件接管，跳过外层执行',
          });
          renderLogs();
          continue;
        }
        const currentNode = nodes.find((node) => node.id === nodeId);
        if (currentNode?.type === 'loop-control') {
          downstreamRunOrderFrom(currentNode.id).forEach((downstreamId) => handledByLoop.add(downstreamId));
        }
        const result = await runNodeById(nodeId, { confirmOverwrite: false });
        if (result === null || result?.ok === false) break;
      }
      executionLogs.push('当前项目运行结束');
      pushExecutionTrace({
        kind: 'workflow',
        status: 'success',
        statusLabel: '项目结束',
        nodeTitle: activeProject()?.name || '当前项目',
      });
      renderLogs();
      persistProjects();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('\n', '&#10;');
    }

    function stringifyOutput(value) {
      if (typeof value === 'string') return value;
      return JSON.stringify(value, null, 2);
    }

    function compactTextLines(items) {
      return items
        .flatMap((item) => Array.isArray(item) ? item : [item])
        .map((item) => String(item || '').trim())
        .filter(Boolean)
        .join('\n');
    }

    function readableObjectText(value) {
      if (!value || typeof value !== 'object') return String(value || '').trim();
      if (Array.isArray(value)) {
        return compactTextLines(value.map((item, index) => {
          if (typeof item === 'string') return item;
          if (item && typeof item === 'object') {
            return compactTextLines([
              item.title,
              item.angle,
              item.copy,
              item.answer,
              item.summary,
              item.text,
              item.materialHint ? `素材建议：${item.materialHint}` : '',
            ]);
          }
          return `${index + 1}. ${String(item || '')}`;
        }));
      }
      return compactTextLines([
        value.copy,
        value.answer,
        value.summary,
        value.rawText,
        value.strategy,
        value.audience,
        value.keyPoints,
        value.structure,
        value.risks,
        value.nextActions,
        value.reusablePattern,
        value.variants,
        value.followUpQuestions,
      ]);
    }

    function extractTextProductionOutput(result) {
      if (typeof result === 'string') return result.trim();
      if (!result || typeof result !== 'object') return '';
      if (result.type === 'node-running') return result.message || '正在生成口播脚本，请稍等...';
      if (result.ok === false) return result.message || result.error || '口播脚本生成失败';
      const payload = result.payload && typeof result.payload === 'object' ? result.payload : result;
      if (typeof result.scriptText === 'string' && result.scriptText.trim()) return result.scriptText.trim();
      if (typeof payload.scriptText === 'string' && payload.scriptText.trim()) return payload.scriptText.trim();
      if (typeof result.handoffText === 'string' && result.handoffText.trim()) return result.handoffText.trim();
      if (typeof result.displayOutput === 'string' && result.displayOutput.trim()) return result.displayOutput.trim();
      return readableObjectText(payload) || stringifyOutput(result);
    }

    function getVideoRecognitionSourceResult(result) {
      if (typeof result === 'string') return parseMaybeJson(result);
      if (!result || typeof result !== 'object') return {};
      return result.payload && typeof result.payload === 'object' ? { ...result, payload: result.payload } : result;
    }

    function extractVideoRecognitionText(result, key) {
      const source = getVideoRecognitionSourceResult(result);
      const payload = source.payload && typeof source.payload === 'object' ? source.payload : source;
      const aliasMap = {
        contentAnalysis: ['contentAnalysis', 'recognizedContent', 'contentSummary', 'summary', 'content', 'answer', 'copy', 'text', 'rawText'],
        scriptExtraction: ['scriptExtraction', 'scriptText', 'transcript', 'copy', 'text', 'answer', 'rawText'],
        frameAnalysis: ['frameAnalysis', 'visualStyle', 'frameStyle', 'style', 'shotAnalysis', 'visualAnalysis', 'description', 'summary', 'text', 'rawText'],
      };
      const lookupKeys = aliasMap[key] || [key];
      const directValue = lookupKeys
        .flatMap((field) => [payload?.[field], source?.[field]])
        .find((value) => typeof value === 'string' && value.trim());
      if (directValue) return String(directValue).trim();
      const nested = lookupKeys
        .map((field) => payload?.[field] ?? source?.[field])
        .find((value) => value && typeof value === 'object');
      if (nested && typeof nested === 'object') {
        return readableObjectText(nested);
      }
      return '';
    }

    function renderVideoRecognitionOutput(node, value) {
      const parsed = parseMaybeJson(value);
      const input = normalizeNodeInput(node);
      const selectedOutputs = Array.isArray(input.outputs) && input.outputs.length
        ? input.outputs
        : ['contentAnalysis', 'scriptExtraction', 'frameAnalysis'];
      const sections = [];
      const sectionMap = {
        contentAnalysis: {
          label: '内容总结',
          hint: '视频在讲什么',
          text: extractVideoRecognitionText(parsed, 'contentAnalysis') || extractVideoRecognitionText(parsed, 'recognizedContent') || '未识别到内容总结。',
        },
        scriptExtraction: {
          label: '纯脚本',
          hint: '可直接给下游脚本节点',
          text: extractVideoRecognitionText(parsed, 'scriptExtraction') || extractVideoRecognitionText(parsed, 'scriptText') || '未识别到脚本。',
        },
        frameAnalysis: {
          label: '画面风格',
          hint: '镜头 / 节奏 / 画面气质',
          text: extractVideoRecognitionText(parsed, 'frameAnalysis') || '未识别到画面风格。',
        },
      };
      selectedOutputs.forEach((key) => {
        const section = sectionMap[key];
        if (section) sections.push(section);
      });
      return sections.map((section) => `
        <div class="video-output-card">
          <div>
            <strong>${escapeHtml(section.label)}</strong>
            <p>${escapeHtml(section.hint)}</p>
          </div>
          <textarea readonly spellcheck="false">${escapeHtml(section.text)}</textarea>
        </div>
      `).join('');
    }

    function displayOutputForNode(node, result) {
      if (result && typeof result === 'object' && result.type === 'node-running') {
        return result.message || '正在执行当前节点，请稍等...';
      }
      if (result && typeof result === 'object' && result.ok === false) {
        return result.message || result.error || '节点执行失败';
      }
      if (node?.type === 'text-production' || result?.type === 'text-production-result' || result?.type === 'script-variation-result') {
        return extractTextProductionOutput(result);
      }
      if (node?.type === 'video-recognition' || result?.type === 'video-recognition-result') {
        const parsed = parseMaybeJson(result);
        const sections = [
          extractVideoRecognitionText(parsed, 'contentAnalysis') || extractVideoRecognitionText(parsed, 'recognizedContent'),
          extractVideoRecognitionText(parsed, 'scriptExtraction') || extractVideoRecognitionText(parsed, 'scriptText'),
          extractVideoRecognitionText(parsed, 'frameAnalysis'),
        ].filter(Boolean);
        return sections.join('\n\n');
      }
      if (node?.type === 'video-params' || result?.type === 'video-params-result') {
        const payload = result?.payload && typeof result.payload === 'object' ? result.payload : result;
        return [
          `视频比例：${payload?.ratio || '4:3'}`,
          payload?.targetDuration ? `目标时长：${payload.targetDuration}` : '',
          payload?.visualStyle ? `画面风格：${payload.visualStyle}` : '',
          payload?.materialPreference ? `素材要求：${payload.materialPreference}` : '',
          payload?.requirement ? `补充需求：${payload.requirement}` : '',
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'seed-library' || result?.type === 'seed-library-result') {
        const payload = result?.payload && typeof result.payload === 'object' ? result.payload : result;
        return [
          payload?.seedVideoUrl || payload?.videoUrl ? `原始视频：${payload.seedVideoUrl || payload.videoUrl}` : '',
          payload?.seedCosUrl ? `种子目录：${payload.seedCosUrl}` : '',
          payload?.txtScript ? `种子内容说明：\n${payload.txtScript}` : '',
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'loop-control' || result?.type === 'loop-control-result') {
        const payload = result?.payload && typeof result.payload === 'object' ? result.payload : result;
        const prompts = Array.isArray(payload?.prompts) ? payload.prompts : [];
        return [
          `循环次数：${payload?.count || 1}`,
          ...prompts.map((prompt, index) => `第 ${index + 1} 轮：${prompt || '自动裂变'}`),
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'material-package' || result?.type === 'material-package-result') {
        const blocks = Array.isArray(result?.blocks) ? result.blocks : [];
        return [
          `素材包：${result?.packageName || '素材包'}`,
          `比例：${result?.ratio || '4:3'}`,
          result?.packageRootDir ? `素材包根目录：${result.packageRootDir}` : '',
          result?.packageDir ? `本次包目录：${result.packageDir}` : '',
          Array.isArray(result?.createdKeys) ? `占位对象：${result.createdKeys.length} 个` : '',
          '',
          ...blocks.flatMap((block) => [
            `${String(block.order).padStart(2, '0')}_${block.folderName}`,
            ...(block.items || []).map((item) => `  ${String(item.order).padStart(2, '0')}_${item.folderName}｜${item.text || ''}`),
          ]),
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'tts' || result?.type === 'voice-package-result') {
        return [
          '语音已生成',
          `时长：${formatDurationMs(result?.durationMs || 0)}`,
          `字幕：${Array.isArray(result?.subtitles) ? result.subtitles.length : 0} 条`,
          `画面时间轴：${Array.isArray(result?.visualTimeline) ? result.visualTimeline.length : 0} 段`,
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'edit' || result?.type === 'video-render-plan-result') {
        const summary = result?.summary || {};
        const scenes = Array.isArray(result?.scenes) ? result.scenes : [];
        return [
          '剪辑方案已生成',
          `画面场景：${summary.sceneCount || scenes.length || 0} 段`,
          `语音时长：${formatDurationMs(summary.voiceDurationMs || result?.voicePackage?.durationMs || 0)}`,
          `比例：${summary.ratio || result?.ratio || '16:9'}`,
          result?.instruction ? `要求：${result.instruction}` : '',
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'review' || result?.type === 'review-result') {
        const summary = result?.summary || {};
        return [
          '审核结果已生成',
          summary.passed ? '状态：通过' : '状态：待补全',
          `问题：${Array.isArray(summary.issues) ? summary.issues.length : 0} 个`,
          result?.exportHint ? `导出建议：${result.exportHint}` : '',
        ].filter(Boolean).join('\n');
      }
      if (node?.type === 'content-sandbox' || result?.type === 'content-sandbox-result') {
        const items = Array.isArray(result?.items) ? result.items : [];
        return [
          `内容沙盒：已收纳 ${items.length} 个前置节点产出`,
          ...(result?.summary?.loopContext ? [`循环次数：${result.summary.loopContext.count || 1}`] : []),
          ...items.map((item) => `${String(item.order).padStart(2, '0')}. ${item.sourceNodeTitle}｜${item.stageLabel}｜${item.amount}`),
        ].filter(Boolean).join('\n');
      }
      return stringifyOutput(result);
    }

    function parseMaybeJson(value) {
      if (typeof value !== 'string') return value;
      try {
        return JSON.parse(value);
      } catch {
        return value;
      }
    }

    function isScriptSplitOutput(value) {
      const parsed = parseMaybeJson(value);
      return parsed && typeof parsed === 'object' && parsed.type === 'script-split-result';
    }

    function isMaterialPackageOutput(value) {
      const parsed = parseMaybeJson(value);
      return parsed && typeof parsed === 'object' && parsed.type === 'material-package-result';
    }

    function isVoicePackageOutput(value) {
      const parsed = parseMaybeJson(value);
      return parsed && typeof parsed === 'object' && parsed.type === 'voice-package-result';
    }

    function isContentSandboxOutput(value) {
      const parsed = parseMaybeJson(value);
      return parsed && typeof parsed === 'object' && parsed.type === 'content-sandbox-result';
    }

    function formatDurationMs(durationMs = 0) {
      const totalSeconds = Math.max(0, Math.round(Number(durationMs || 0) / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return minutes ? `${minutes}:${String(seconds).padStart(2, '0')}` : `${seconds} 秒`;
    }

    function firstMediaUrlFromResult(result, mediaType) {
      const parsed = parseMaybeJson(result);
      if (!parsed || typeof parsed !== 'object') return '';
      const candidates = [
        parsed.audioUrl,
        parsed.videoUrl,
        parsed.imageUrl,
        parsed.coverUrl,
        parsed.payload?.audioUrl,
        parsed.payload?.videoUrl,
        parsed.payload?.imageUrl,
      ].filter(Boolean);
      const url = candidates.find((item) => typeof item === 'string' && item.trim()) || '';
      if (!url) return '';
      if (mediaType === 'audio' && !/\.(mp3|wav|m4a|aac|ogg)(\?|$)/i.test(url) && !url.includes('/tts/')) return '';
      if (mediaType === 'video' && !/\.(mp4|webm|mov|m4v)(\?|$)/i.test(url)) return '';
      if (mediaType === 'image' && !/\.(png|jpe?g|webp|gif)(\?|$)/i.test(url)) return '';
      return url;
    }

    function renderContentSandboxOutput(value) {
      const result = parseMaybeJson(value) || {};
      const items = Array.isArray(result.items) ? result.items : [];
      const loopContext = result.summary?.loopContext || result.globalContext?.loopContext || null;
      const groups = items.reduce((list, item) => {
        const existing = list.find((group) => group.sourceNodeId === item.sourceNodeId);
        if (existing) {
          existing.items.push(item);
          return list;
        }
        list.push({
          sourceNodeId: item.sourceNodeId,
          sourceNodeTitle: item.sourceNodeTitle,
          stageLabel: item.stageLabel,
          items: [item],
        });
        return list;
      }, []);
      if (sandboxViewState.sourceNodeId && !groups.some((group) => group.sourceNodeId === sandboxViewState.sourceNodeId)) {
        sandboxViewState = { sourceNodeId: '', page: 0 };

      const selectedGroup = groups.find((group) => group.sourceNodeId === sandboxViewState.sourceNodeId);
      if (selectedGroup) {

        sandboxViewState.page = page;
        const item = selectedGroup.items[page];
        const raw = item?.rawResult;
        const audioUrl = firstMediaUrlFromResult(raw, 'audio');

        const preview = item?.outputText || stringifyOutput(raw);

          </div>

          ${groups.map((group, groupIndex) => {
            return `

                <header>
                  <div>
                    <strong>${escapeHtml(group.sourceNodeTitle || `前置节点 ${groupIndex + 1}`)}</strong>
                    <p>${escapeHtml(group.stageLabel || '节点产出')}</p>
                  </div>
                  <em>${group.items.length} 次</em>
                </header>
              </button>
            `;
          }).join('')}
        </div>

      sandboxOutputEditor.querySelectorAll('[data-sandbox-source]').forEach((button) => {

    function splitScriptByPunctuation(text) {
      const source = String(text || '').replace(/\s+/g, '').trim();
      const matches = source.match(/[^，。！？!?；;、,.]+[，。！？!?；;、,.]?/g) || [];
      return matches.map((part, index) => {
        const trimmed = part.trim();
        const delimiter = trimmed.match(/[，。！？!?；;、,.]$/)?.[0] || '';
        return {
          id: `seg-${String(index + 1).padStart(3, '0')}`,
          order: index + 1,
          text: trimmed,
          delimiter,
        };
      }).filter((item) => item.text);
    }

    function splitVisualUnitText(text) {
      const source = String(text || '').replace(/\s+/g, '').trim();
      const matches = source.match(/[^，。！？!?；;、,.]+[，。！？!?；;、,.]?/g) || [];
      return matches.map((part) => {
        const trimmed = part.trim();
        const delimiter = trimmed.match(/[，。！？!?；;、,.]$/)?.[0] || '';
        return {
          text: trimmed.replace(/[，。！？!?；;、,.]+$/g, '').trim(),
          delimiter,
        };
      }).filter((item) => item.text);
    }

    function canSplitVisualGroup(group) {
      if (!group) return false;
      if ((group.segmentIds || []).length > 1) return true;
      return splitVisualUnitText(group.text || '').length > 1;
    }

    function normalizeMaterialType(value) {
      return ['general', 'guided', 'specific'].includes(value) ? value : 'general';
    }

    function materialTypeLabel(value) {
      const type = normalizeMaterialType(value);
      if (type === 'specific') return '专用画面';
      if (type === 'guided') return '方向画面';
      return '通用画面';
    }

    function buildContentBlocksFromVisualGroups(rawBlocks, visualGroups, segmentById = {}) {
      const blockMap = new Map();
      rawBlocks.forEach((block, index) => {
        const id = block.id || `block-${String(index + 1).padStart(3, '0')}`;
        blockMap.set(id, {
          id,
          order: Number(block.order || index + 1),
          role: block.role || '内容大段',
          segmentIds: [],
          text: block.text || '',
          visualUnits: [],
        });
      });
      visualGroups.forEach((group, index) => {
        const blockId = group.blockId || `block-${String(index + 1).padStart(3, '0')}`;
        if (!blockMap.has(blockId)) {
          blockMap.set(blockId, {
            id: blockId,
            order: Number(group.blockOrder || blockMap.size + 1),
            role: group.blockRole || '内容大段',
            mainIdea: group.blockMainIdea || '',
            segmentIds: [],
            text: '',
            splitReason: group.blockSplitReason || '',
            visualUnits: [],
          });
        }
        const block = blockMap.get(blockId);
        block.segmentIds = [...new Set([...block.segmentIds, ...(group.segmentIds || [])])];
        block.visualUnits.push({
          id: group.id,
          order: Number(group.unitOrder || block.visualUnits.length + 1),
          segmentIds: group.segmentIds || [],
          text: group.text || '',
          mergeByAi: Boolean(group.mergeByAi),
          materialType: normalizeMaterialType(group.materialType),
          mergeLocked: Boolean(group.mergeLocked),
          splitSourceId: group.splitSourceId || '',
        });
        block.text = block.segmentIds.map((id) => segmentById[id]?.text || '').join('') || block.text;
      });
      return [...blockMap.values()]
        .sort((a, b) => a.order - b.order)
        .map((block, index) => ({
          ...block,
          order: index + 1,
          text: block.text || block.visualUnits.map((unit) => unit.text || '').join(''),
          visualUnits: block.visualUnits.map((unit, unitIndex) => ({ ...unit, order: unitIndex + 1 })),
        }));
    }

    function normalizeScriptSplitResult(result) {
      const parsed = parseMaybeJson(result);
      const base = parsed && typeof parsed === 'object' ? parsed : {
        ok: true,
        type: 'script-split-result',
        cleanScript: String(parsed || ''),
      };
      const cleanScript = String(base.cleanScript || base.script || base.text || '').replace(/\s+/g, '').trim();
      const rawSegments = Array.isArray(base.punctuationSegments) && base.punctuationSegments.length
        ? base.punctuationSegments
        : splitScriptByPunctuation(cleanScript);
      const punctuationSegments = rawSegments.map((segment, index) => ({
        id: segment.id || `seg-${String(index + 1).padStart(3, '0')}`,
        order: Number(segment.order || index + 1),
        text: String(segment.text || '').trim(),
        delimiter: segment.delimiter || String(segment.text || '').trim().match(/[，。！？!?；;、,.]$/)?.[0] || '',
      })).filter((segment) => segment.text);
      const segmentById = Object.fromEntries(punctuationSegments.map((segment) => [segment.id, segment]));
      const rawBlocks = Array.isArray(base.contentBlocks) && base.contentBlocks.length ? base.contentBlocks : [];
      let visualGroups = Array.isArray(base.visualGroups) && base.visualGroups.length && base.editedByUser
        ? base.visualGroups
        : [];
      if (!visualGroups.length) {
        visualGroups = rawBlocks.flatMap((block, blockIndex) => {
        const units = Array.isArray(block.visualUnits) && block.visualUnits.length
          ? block.visualUnits
          : [{
              id: `${block.id || `block-${blockIndex + 1}`}-unit-001`,
              order: 1,
              segmentIds: block.segmentIds || [],
              text: block.text || '',
              mergeByAi: true,
              mergeReason: '按内容大段兜底生成画面单元',
              materialType: 'general',
              mergeLocked: false,
            }];
        return units.map((unit, unitIndex) => ({
          ...unit,
          blockId: block.id || `block-${String(blockIndex + 1).padStart(3, '0')}`,
          blockOrder: Number(block.order || blockIndex + 1),
          blockRole: block.role || '内容大段',
          blockText: block.text || '',
          unitOrder: Number(unit.order || unitIndex + 1),
        }));
        });
      }
      if (!visualGroups.length && Array.isArray(base.visualGroups) && base.visualGroups.length) {
        visualGroups = base.visualGroups;
      }
      if (!visualGroups.length) {
        visualGroups = punctuationSegments.map((segment, index) => ({
          id: `group-${String(index + 1).padStart(3, '0')}`,
          order: index + 1,
          segmentIds: [segment.id],
          text: segment.text,
          mergeByAi: false,
          blockId: 'block-001',
          blockOrder: 1,
          blockRole: '内容大段',
          unitOrder: index + 1,
          materialType: 'general',
          mergeLocked: false,
        }));
      }
      visualGroups = visualGroups.map((group, index) => {
        const segmentIds = Array.isArray(group.segmentIds) && group.segmentIds.length
          ? group.segmentIds.filter((id) => segmentById[id])
          : [];
        const ids = segmentIds.length ? segmentIds : [punctuationSegments[index]?.id].filter(Boolean);
        const text = String(group.text || ids.map((id) => segmentById[id]?.text || '').join('')).trim();
        return {
          id: group.id || `group-${String(index + 1).padStart(3, '0')}`,
          order: index + 1,
          segmentIds: ids,
          text,
          mergeByAi: Boolean(group.mergeByAi || ids.length > 1),
          blockId: group.blockId || group.contentBlockId || `block-${String(index + 1).padStart(3, '0')}`,
          blockOrder: Number(group.blockOrder || group.contentBlockOrder || index + 1),
          blockRole: group.blockRole || group.role || '内容大段',
          unitOrder: Number(group.unitOrder || group.order || index + 1),
          materialType: normalizeMaterialType(group.materialType),
          mergeLocked: Boolean(group.mergeLocked || group.materialType === 'specific'),
          splitSourceId: group.splitSourceId || '',
        };
      }).filter((group) => group.segmentIds.length || group.text);
      return {
        ...base,
        ok: base.ok !== false,
        type: 'script-split-result',
        cleanScript,
        punctuationSegments,
        contentBlocks: buildContentBlocksFromVisualGroups(rawBlocks, visualGroups, segmentById),
        visualGroups,
      };
    }

    function syncScriptSplitBlocks(result) {
      const segmentById = Object.fromEntries((result.punctuationSegments || []).map((segment) => [segment.id, segment]));
      const rawBlocks = Array.isArray(result.contentBlocks) ? result.contentBlocks : [];
      result.visualGroups = (result.visualGroups || []).map((group, index) => ({
        ...group,
        order: index + 1,
        unitOrder: index + 1,
      }));
      result.contentBlocks = buildContentBlocksFromVisualGroups(rawBlocks, result.visualGroups, segmentById);
      result.editedByUser = true;
      return result;
    }

    function currentScriptSplitResult() {
      return normalizeScriptSplitResult(parseMaybeJson(nodeResultEditor.value || '{}'));
    }

    function syncScriptSplitEditorResult(nextResult) {
      const normalized = normalizeScriptSplitResult(nextResult);
      nodeResultEditor.value = stringifyOutput(normalized);
      renderScriptSplitOutputEditor(normalized);

    function renderScriptSplitOutputEditor(value) {

      const segmentById = Object.fromEntries(result.punctuationSegments.map((segment) => [segment.id, segment]));
      selectedScriptGroupIndexes = new Set([...selectedScriptGroupIndexes].filter((index) => index >= 0 && index < result.visualGroups.length));
      const selectedIndexes = [...selectedScriptGroupIndexes].sort((a, b) => a - b);
      const selectedGroups = selectedIndexes.map((index) => result.visualGroups[index]).filter(Boolean);
      const canMerge = selectedIndexes.length >= 2
        && selectedIndexes.every((index, itemIndex) => itemIndex === 0 || index === selectedIndexes[itemIndex - 1] + 1)
        && canMergeScriptGroups(selectedGroups);
      const canSplit = selectedIndexes.length === 1 && canSplitVisualGroup(result.visualGroups[selectedIndexes[0]]);
      const blockGroups = buildContentBlocksFromVisualGroups(result.contentBlocks || [], result.visualGroups, segmentById);

      scriptOutputEditor.innerHTML = `

                }).join('')}
              </div>
            </section>
          `).join('')}
        </div>
      `;
      const cleanEditor = scriptOutputEditor.querySelector('#cleanScriptEditor');
      cleanEditor.addEventListener('input', () => {

      scriptOutputEditor.querySelectorAll('.script-visual-unit').forEach((button) => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.groupIndex);
          toggleScriptGroupSelection(index);
        });
      });
      scriptOutputEditor.querySelector('#mergeSelectedScriptGroups')?.addEventListener('click', mergeSelectedScriptGroups);
      scriptOutputEditor.querySelector('#splitSelectedScriptGroup')?.addEventListener('click', splitSelectedScriptGroup);
      scriptOutputEditor.querySelector('#clearScriptGroupSelection')?.addEventListener('click', () => {
        selectedScriptGroupIndexes = new Set();
        renderScriptSplitOutputEditor(currentScriptSplitResult());
      });
    }

    function toggleScriptGroupSelection(index) {
      const next = new Set(selectedScriptGroupIndexes);
      if (next.has(index)) {
        next.delete(index);
      } else {
        next.add(index);
      }
      selectedScriptGroupIndexes = next;
      renderScriptSplitOutputEditor(currentScriptSplitResult());
    }

    function selectedScriptIndexes() {
      return [...selectedScriptGroupIndexes].sort((a, b) => a - b);
    }

    function areScriptIndexesContiguous(indexes) {
      return indexes.length > 1 && indexes.every((index, itemIndex) => itemIndex === 0 || index === indexes[itemIndex - 1] + 1);
    }

    function canMergeScriptGroups(groups) {
      if (!groups.length) return false;
      const sameBlock = groups.every((group) => group.blockId === groups[0].blockId);
      if (!sameBlock) return false;
      const hasLocked = groups.some((group) => group.mergeLocked);
      if (!hasLocked) return true;
      const sourceId = groups[0].splitSourceId || '';
      return Boolean(sourceId) && groups.every((group) => group.splitSourceId === sourceId);
    }

    function mergeScriptGroups(leftIndex) {
      const result = currentScriptSplitResult();
      if (leftIndex < 0 || leftIndex >= result.visualGroups.length - 1) return;
      const left = result.visualGroups[leftIndex];
      const right = result.visualGroups[leftIndex + 1];
      if (!canMergeScriptGroups([left, right])) return;
      const mergedMaterialType = left.materialType === right.materialType ? normalizeMaterialType(left.materialType) : 'general';
      const merged = {
        id: left.id || `group-${String(leftIndex + 1).padStart(3, '0')}`,
        order: leftIndex + 1,
        segmentIds: [...left.segmentIds, ...right.segmentIds],
        text: `${left.text || ''}${right.text || ''}`,
        mergeByAi: false,
        blockId: left.blockId,
        blockOrder: left.blockOrder,
        blockRole: left.blockRole,
        unitOrder: left.unitOrder,
        materialType: mergedMaterialType,
        mergeLocked: mergedMaterialType === 'specific',
        splitSourceId: left.splitSourceId && left.splitSourceId === right.splitSourceId ? left.splitSourceId : '',
      };
      result.visualGroups.splice(leftIndex, 2, merged);
      result.visualGroups = result.visualGroups.map((group, index) => ({ ...group, order: index + 1 }));
      selectedScriptGroupIndexes = new Set([leftIndex]);
      syncScriptSplitEditorResult(syncScriptSplitBlocks(result));
    }

    function mergeSelectedScriptGroups() {
      const indexes = selectedScriptIndexes();
      if (!areScriptIndexesContiguous(indexes)) return;
      const result = currentScriptSplitResult();
      const selectedGroups = indexes.map((index) => result.visualGroups[index]).filter(Boolean);
      if (selectedGroups.length < 2) return;
      if (!canMergeScriptGroups(selectedGroups)) return;
      const firstIndex = indexes[0];
      const sameMaterialType = selectedGroups.every((group) => group.materialType === selectedGroups[0].materialType);
      const mergedMaterialType = sameMaterialType ? normalizeMaterialType(selectedGroups[0].materialType) : 'general';
      const sourceId = selectedGroups[0].splitSourceId || '';
      const sameSource = Boolean(sourceId) && selectedGroups.every((group) => group.splitSourceId === sourceId);
      const merged = {
        id: selectedGroups[0].id || `group-${String(firstIndex + 1).padStart(3, '0')}`,
        order: firstIndex + 1,
        segmentIds: selectedGroups.flatMap((group) => group.segmentIds || []),
        text: selectedGroups.map((group) => group.text || '').join(''),
        mergeByAi: false,
        blockId: selectedGroups[0].blockId,
        blockOrder: selectedGroups[0].blockOrder,
        blockRole: selectedGroups[0].blockRole,
        unitOrder: selectedGroups[0].unitOrder,
        materialType: mergedMaterialType,
        mergeLocked: mergedMaterialType === 'specific',
        splitSourceId: sameSource ? sourceId : '',
      };
      result.visualGroups.splice(firstIndex, selectedGroups.length, merged);
      result.visualGroups = result.visualGroups.map((group, index) => ({ ...group, order: index + 1 }));
      selectedScriptGroupIndexes = new Set([firstIndex]);
      syncScriptSplitEditorResult(syncScriptSplitBlocks(result));
    }

    function splitScriptGroup(index) {
      const result = currentScriptSplitResult();
      const group = result.visualGroups[index];
      if (!group || !canSplitVisualGroup(group)) return;
      const segmentById = Object.fromEntries(result.punctuationSegments.map((segment) => [segment.id, segment]));
      const existingParts = (group.segmentIds || [])
        .map((segmentId) => segmentById[segmentId])
        .filter(Boolean)
        .map((segment) => ({
          id: segment.id,
          text: String(segment.text || '').replace(/[，。！？!?；;、,.]+$/g, '').trim(),
          delimiter: segment.delimiter || String(segment.text || '').trim().match(/[，。！？!?；;、,.]$/)?.[0] || '',
        }))
        .filter((part) => part.text);
      const textParts = splitVisualUnitText(group.text || '');
      const parts = textParts.length > 1 ? textParts : existingParts;
      if (parts.length <= 1) return;
      const existingIds = new Set(result.punctuationSegments.map((segment) => segment.id));
      const stamp = Date.now().toString(36);
      const splitSegments = parts.map((part, splitIndex) => {
        const reusable = existingParts.length === parts.length ? existingParts[splitIndex] : null;
        if (reusable?.id && existingIds.has(reusable.id)) {
          return {
            id: reusable.id,
            order: result.punctuationSegments.find((segment) => segment.id === reusable.id)?.order || result.punctuationSegments.length + splitIndex + 1,
            text: reusable.text,
            delimiter: reusable.delimiter,
          };
        }
        return {
          id: `${group.id || 'unit'}-seg-${splitIndex + 1}-${stamp}`,
          order: result.punctuationSegments.length + splitIndex + 1,
          text: part.text,
          delimiter: part.delimiter || '',
        };
      });
      const reusableIds = new Set(existingParts.map((part) => part.id).filter(Boolean));
      result.punctuationSegments = [
        ...result.punctuationSegments.filter((segment) => !reusableIds.has(segment.id)),
        ...splitSegments,
      ].map((segment, segmentIndex) => ({
        ...segment,
        order: segmentIndex + 1,
      }));
      const splitGroups = splitSegments.map((segment, splitIndex) => ({
        id: `${group.id}-split-${splitIndex + 1}-${stamp}`,
        order: index + splitIndex + 1,
        segmentIds: [segment.id],
        text: segment.text,
        mergeByAi: false,
        blockId: group.blockId,
        blockOrder: group.blockOrder,
        blockRole: group.blockRole,
        unitOrder: group.unitOrder + splitIndex,
        materialType: normalizeMaterialType(group.materialType),
        mergeLocked: normalizeMaterialType(group.materialType) === 'specific',
        splitSourceId: group.splitSourceId || group.id || `split-source-${stamp}`,
      }));
      result.visualGroups.splice(index, 1, ...splitGroups);
      result.visualGroups = result.visualGroups.map((item, nextIndex) => ({ ...item, order: nextIndex + 1 }));
      selectedScriptGroupIndexes = new Set(splitGroups.map((_, splitIndex) => index + splitIndex));
      syncScriptSplitEditorResult(syncScriptSplitBlocks(result));
    }

    function splitSelectedScriptGroup() {
      const indexes = selectedScriptIndexes();
      if (indexes.length !== 1) return;
      splitScriptGroup(indexes[0]);
    }

    function formatFileSize(size = 0) {
      if (!size) return '已选择文件';
      if (size < 1024 * 1024) return `${Math.round(size / 1024)} KB`;
      return `${(size / 1024 / 1024).toFixed(1)} MB`;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('读取本地视频失败'));
        reader.readAsDataURL(file);
      });
    }

    if (!activeProject()) {
      const project = createProject('新内容项目');
      projects = [project];
      activeProjectId = project.id;
    }
    loadProjectToCanvas(activeProject());
    renderPalette();
    renderAll();
    persistProjects();
  </script>
</body>
</html>
