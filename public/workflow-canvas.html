<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>自由工作流</title>
  <style>
    :root {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #0f172a;
      background: #f6f8fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    body {
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 255, 255, 0.98), transparent 24%),
        radial-gradient(circle at 24% 16%, rgba(180, 205, 255, 0.24), transparent 22%),
        radial-gradient(circle at 82% 12%, rgba(208, 217, 255, 0.24), transparent 20%),
        radial-gradient(circle at 52% 110%, rgba(191, 219, 254, 0.2), transparent 26%),
        linear-gradient(180deg, #fbfcfe 0%, #eef3f8 100%);
    }

    .app {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }

    .canvas-wrap,
    .dock-pane {
      min-height: 0;
      border: 1px solid rgba(255, 255, 255, 0.78);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(246, 249, 253, 0.76)),
        rgba(255, 255, 255, 0.74);
      box-shadow:
        0 30px 90px rgba(148, 163, 184, 0.16),
        inset 0 1px rgba(255, 255, 255, 0.92),
        inset 0 -1px rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(34px) saturate(1.18);
      -webkit-backdrop-filter: blur(34px) saturate(1.18);
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 28px;
    }

    .canvas-wrap {
      position: relative;
      min-width: 0;
      border-radius: 28px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .canvas-wrap::before,
    .dock-pane::before,
    .trace-panel::before,
    .node::before,
    .project-item::before,
    .palette-item::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.48), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 36%);
      opacity: 0.9;
    }

    .panel-head {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      background: rgba(255, 255, 255, 0.18);
    }

    .panel-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 12px 26px rgba(148, 163, 184, 0.12),
        inset 0 1px rgba(255, 255, 255, 0.94);
      color: #0f172a;
      font-size: 16px;
    }

    .panel-head strong {
      display: block;
      font-size: 14px;
      font-weight: 900;
    }

    .panel-head p, .hint-card p {
      margin: 4px 0 0;
      color: rgba(15, 23, 42, 0.78);
      font-size: 12px;
      line-height: 1.45;
    }

    .project-panel,
    .node-palette {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding: 14px;
    }

    .palette-group {
      display: block;
    }

    .palette-group + .palette-group {
      margin-top: 4px;
    }

    .palette-group-summary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      padding: 0 4px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: rgba(15, 23, 42, 0.82);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      text-align: left;
      user-select: none;
      transition: background 180ms ease, color 180ms ease;
    }

    .palette-group-summary:hover {
      background: rgba(255, 255, 255, 0.46);
      color: #0f172a;
    }

    .palette-group-summary::after {
      content: "+";
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: rgba(15, 23, 42, 0.62);
      font-size: 16px;
      font-weight: 500;
      line-height: 1;
      transition: transform 220ms ease, background 180ms ease;
    }

    .palette-group.is-open .palette-group-summary::after {
      content: "−";
      transform: rotate(180deg);
      background: rgba(255, 255, 255, 0.9);
    }

    .palette-group-summary span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .palette-group-summary small {
      color: rgba(15, 23, 42, 0.54);
      font-size: 10px;
      font-weight: 750;
    }

    .palette-group-list {
      display: grid;
      gap: 8px;
      max-height: 0;
      overflow: hidden;
      padding-top: 0;
      opacity: 0;
      transform: translateY(-7px);
      transition:
        max-height 280ms cubic-bezier(.2, .8, .2, 1),
        padding-top 280ms ease,
        opacity 180ms ease,
        transform 280ms cubic-bezier(.2, .8, .2, 1);
    }

    .palette-group.is-open .palette-group-list {
      max-height: 900px;
      padding-top: 8px;
      opacity: 1;
      transform: translateY(0);
    }

    .project-panel {
      max-height: 260px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .project-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .project-actions input {
      min-width: 0;
      height: 42px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.82);
      color: #0f172a;
      font-size: 13px;
      outline: none;
    }

    .project-actions input:focus {
      border-color: rgba(78, 132, 255, 0.36);
      box-shadow: 0 0 0 4px rgba(78, 132, 255, 0.11);
    }

    .project-actions button {
      height: 42px;
      border: 0;
      border-radius: 14px;
      padding: 0 14px;
      background: linear-gradient(180deg, #111827, #0b1220);
      color: #fff;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 14px 24px rgba(15, 23, 42, 0.18);
    }

    .project-list {
      display: grid;
      gap: 8px;
    }

    .project-item {
      position: relative;
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 18px;
      padding: 9px 10px;
      background: rgba(255, 255, 255, 0.72);
      color: #0f172a;
      text-align: left;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.68);
    }

    .project-item.is-active {
      border-color: rgba(78, 132, 255, 0.28);
      background: rgba(78, 132, 255, 0.08);
    }

    .project-item strong {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-item span {
      display: block;
      margin-top: 3px;
      color: rgba(15, 23, 42, 0.64);
      font-size: 11px;
    }

    .project-delete {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      color: #0f172a;
      font-weight: 900;
    }

    .project-delete:hover {
      background: rgba(248, 113, 113, 0.14);
      color: #b91c1c;
    }

    .panel-subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 0;
      color: rgba(15, 23, 42, 0.74);
      font-size: 12px;
      font-weight: 850;
    }

    .palette-item {
      position: relative;
      overflow: hidden;
      min-height: 48px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 18px;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.72);
      color: #0f172a;
      text-align: left;
      transition: transform 160ms ease, border-color 160ms ease;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.7);
    }

    .palette-item > * {
      position: relative;
      z-index: 1;
    }

    .palette-item:hover {
      border-color: color-mix(in srgb, var(--accent), white 44%);
      transform: translateY(-1px);
      box-shadow:
        0 16px 30px rgba(148, 163, 184, 0.16),
        inset 0 1px rgba(255, 255, 255, 0.82);
    }

    .palette-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.86);
      color: #0f172a;
      box-shadow:
        0 8px 18px rgba(148, 163, 184, 0.1),
        inset 0 1px rgba(255, 255, 255, 0.9);
      font-size: 15px;
    }

    .palette-icon svg,
    .node-icon svg {
      width: 16px;
      height: 16px;
      display: block;
      color: currentColor;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .palette-item b {
      display: block;
      font-size: 13px;
      font-weight: 850;
    }

    .palette-item small {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: rgba(15, 23, 42, 0.72);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(255, 255, 255, 0.2);
    }

    .toolbar strong {
      display: block;
      font-size: 15px;
      font-weight: 900;
    }

    .toolbar span {
      display: block;
      margin-top: 4px;
      color: rgba(15, 23, 42, 0.72);
      font-size: 12px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .toolbar-actions button {
      min-width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.84);
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      box-shadow:
        0 12px 24px rgba(148, 163, 184, 0.12),
        inset 0 1px rgba(255, 255, 255, 0.92);
    }

    .toolbar-actions .run {
      border-color: rgba(15, 23, 42, 0.06);
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      box-shadow:
        0 12px 28px rgba(148, 163, 184, 0.14),
        inset 0 1px rgba(255, 255, 255, 0.94);
    }

    .toolbar-actions .template {
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
    }

    .toolbar-actions .selection-count {
      min-width: auto;
      border-radius: 999px;
      padding: 0 4px;
      color: rgba(15, 23, 42, 0.72);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .toolbar-actions .danger {
      border-color: rgba(248, 113, 113, 0.22);
      background: rgba(255, 255, 255, 0.78);
      color: #b91c1c;
    }

    .canvas {
      position: relative;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.8), transparent 24%),
        radial-gradient(circle at 50% 110%, rgba(214, 227, 255, 0.28), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, #eef4f9 100%);
      touch-action: none;
    }

    .canvas:active { cursor: grabbing; }

    .trace-toggle {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 8;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      padding: 0 12px;
      box-shadow: 0 16px 30px rgba(148, 163, 184, 0.12);
      font-size: 12px;
      font-weight: 900;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .trace-panel {
      position: absolute;
      left: 16px;
      bottom: 60px;
      z-index: 8;
      width: min(460px, calc(100% - 32px));
      max-height: min(520px, calc(100% - 92px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 252, 0.76));
      box-shadow: 0 28px 64px rgba(148, 163, 184, 0.16);
      overflow: hidden;
      backdrop-filter: blur(24px) saturate(1.08);
      -webkit-backdrop-filter: blur(24px) saturate(1.08);
    }

    .trace-panel[hidden] {
      display: none;
    }

    .trace-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .trace-head strong {
      display: block;
      color: #0f172a;
      font-size: 13px;
      font-weight: 950;
    }

    .trace-head span {
      display: block;
      margin-top: 2px;
      color: rgba(15, 23, 42, 0.72);
      font-size: 11px;
      font-weight: 750;
    }

    .trace-head button {
      height: 30px;
      border: 1px solid rgba(255, 255, 255, 0.74);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: rgba(15, 23, 42, 0.72);
      padding: 0 9px;
      font-size: 12px;
      font-weight: 900;
    }

    .trace-list {
      min-height: 0;
      overflow: auto;
      padding: 10px 12px 12px;
    }

    .trace-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      padding: 9px;
      margin-bottom: 8px;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.72);
    }

    .trace-index {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.07);
      color: #334155;
      font-size: 11px;
      font-weight: 950;
    }

    .trace-item b {
      display: block;
      color: #0f172a;
      font-size: 12px;
      font-weight: 950;
      line-height: 1.35;
    }

    .trace-item p {
      margin: 4px 0 0;
      color: rgba(15, 23, 42, 0.72);
      font-size: 11px;
      line-height: 1.45;
    }

    .trace-status {
      border-radius: 999px;
      padding: 4px 7px;
      background: rgba(59, 130, 246, 0.1);
      color: #0369a1;
      font-size: 10px;
      font-weight: 950;
      white-space: nowrap;
    }

    .trace-item.success .trace-status { background: rgba(22, 163, 74, 0.1); color: #15803d; }
    .trace-item.failed .trace-status { background: rgba(185, 28, 28, 0.1); color: #b91c1c; }
    .trace-item.skipped .trace-status { background: rgba(100, 116, 139, 0.12); color: #475569; }
    .trace-item.loop .trace-status { background: rgba(219, 39, 119, 0.1); color: #be185d; }

    .trace-empty {
      border: 1px dashed rgba(148, 163, 184, 0.16);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      padding: 14px;
      color: rgba(15, 23, 42, 0.72);
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .world, .edges {
      position: absolute;
      left: 0;
      top: 0;
      width: 2400px;
      height: 900px;
      transform-origin: 0 0;
    }

    .edges {
      z-index: 1;
      pointer-events: auto;
      overflow: visible;
    }

    .world {
      z-index: 3;
      pointer-events: none;
    }

    .edge-hit {
      cursor: pointer;
      pointer-events: stroke;
    }

    .edge-path {
      pointer-events: none;
      transition: stroke .18s ease, stroke-width .18s ease, filter .18s ease;
    }

    .edge-path.loop-flow {
      stroke: #ff4d9f;
      stroke-width: 3.3;
      filter: drop-shadow(0 0 7px rgba(255, 77, 159, 0.4));
      stroke-dasharray: 10 8;
      animation: loopEdgeDash 1.8s linear infinite, loopEdgePulse 1.6s ease-in-out infinite;
    }

    .edge-group:hover .edge-path,
    .edge-path.selected {
      stroke: #4e84ff;
      stroke-width: 4;
      filter: drop-shadow(0 4px 8px rgba(78, 132, 255, 0.24));
    }

    .edge-path.loop-flow.selected,
    .edge-group:hover .edge-path.loop-flow {
      stroke: #ff79b7;
      filter: drop-shadow(0 0 10px rgba(255, 77, 159, 0.5));
    }

    @keyframes loopEdgeDash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -36; }
    }

    @keyframes loopEdgePulse {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    .edge-delete {
      width: 58px;
      height: 26px;
      border: 1px solid rgba(185, 28, 28, 0.18);
      border-radius: 999px;
      background: #fff;
      color: #b91c1c;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
    }

    .edge-delete:hover {
      background: #fee2e2;
    }

    .edge-delete-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 2400px;
      height: 900px;
      z-index: 4;
      pointer-events: none;
      transform-origin: 0 0;
    }

    .edge-delete-chip {
      position: absolute;
      width: 58px;
      height: 26px;
      border: 1px solid rgba(185, 28, 28, 0.18);
      border-radius: 999px;
      background: #fff;
      color: #b91c1c;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      pointer-events: auto;
    }

    .edge-delete-chip:hover {
      background: #fee2e2;
    }

    .selection-box {
      position: absolute;
      border: 1px solid rgba(78, 132, 255, 0.84);
      background: rgba(78, 132, 255, 0.12);
      border-radius: 14px;
      pointer-events: none;
      z-index: 5;
    }

    .toolbar-actions .danger:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .node {
      position: absolute;
      z-index: 1;
      pointer-events: auto;
      width: 264px;
      min-height: 132px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-top: 4px solid var(--accent);
      border-radius: 14px;
      padding: 14px;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.88), rgba(249, 251, 254, 0.68)),
        rgba(255, 255, 255, 0.74);
      box-shadow:
        0 18px 42px rgba(148, 163, 184, 0.14),
        inset 0 1px rgba(255, 255, 255, 0.96),
        inset 0 -1px rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(34px) saturate(1.15);
      -webkit-backdrop-filter: blur(34px) saturate(1.15);
      cursor: move;
      user-select: none;
    }

    .node.is-global {
      border-color: rgba(51, 65, 85, 0.12);
      border-top-color: #334155;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.9), rgba(247, 250, 252, 0.7)),
        rgba(255, 255, 255, 0.68);
      box-shadow:
        0 18px 38px rgba(148, 163, 184, 0.12),
        inset 0 1px rgba(255, 255, 255, 0.96);
    }

    .node.is-global::after {
      content: "全局透传";
      position: absolute;
      top: -10px;
      left: 14px;
      border: 1px solid rgba(51, 65, 85, 0.16);
      border-radius: 999px;
      background: #0f172a;
      color: #fff;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.16);
    }

    .node.is-loop {
      width: 288px;
      min-height: 150px;
      border-color: rgba(219, 39, 119, 0.14);

    .node-popover {
      position: absolute;
      z-index: 30;
      width: 420px;
      max-height: calc(100% - 24px);
      overflow: auto;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.96);
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      transform-origin: top left;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;

      pointer-events: auto;
      transition: opacity 180ms ease, transform 180ms ease, visibility 0s;
    }

      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;

      white-space: nowrap;
    }

    .sandbox-preview-text {
      max-height: 150px;
      overflow: auto;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.92);
      padding: 10px;
      color: rgba(15, 23, 42, 0.74);
      font-size: 12px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .sandbox-source-card audio,
    .sandbox-source-card video,
    .sandbox-source-card img {
      width: 100%;
      max-height: 220px;
      border-radius: 10px;
      background: #0f172a;
      object-fit: contain;
    }

    .voice-player {
      width: 100%;
      margin-top: 10px;
    }

    .voice-link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .voice-link-row a {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.92);
      color: #0f172a;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }

    .voice-timeline-list {
      display: grid;
      gap: 7px;
    }

    .voice-timeline-item {
      display: grid;
      gap: 4px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.92);
      padding: 9px;
    }

    .voice-timeline-item b {
      color: #0f172a;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.4;
    }

    .voice-timeline-item span {
      color: rgba(15, 23, 42, 0.55);
      font-size: 11px;
      font-weight: 850;
    }

    .material-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .material-actions button,
    .material-actions a {
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 10px;
      background: #fff;
      color: #0f172a;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }

    .material-actions .primary {
      border-color: transparent;
      background: #0f172a;
      color: #fff;
    }

    .material-block-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .material-block {
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.78);
      padding: 10px;
    }

    .material-block h4 {
      margin: 0 0 8px;
      color: #0f172a;
      font-size: 12px;
      font-weight: 950;
    }

    .material-folder-list {
      display: grid;
      gap: 6px;
    }

    .material-folder-item {
      display: grid;
      gap: 3px;
      border-radius: 9px;
      background: #fff;
      padding: 8px;
    }

    .material-folder-item b {
      color: #0f172a;
      font-size: 12px;
      font-weight: 900;
    }

    .material-folder-item span {
      color: rgba(15, 23, 42, 0.56);
      font-size: 11px;
      font-weight: 750;
      line-height: 1.45;
    }

    .script-clean-card,
    .script-group-card {
      border: 1px solid rgba(15, 23, 42, 0.09);
      border-radius: 14px;
      background: #fff;
      padding: 12px;
    }

    .script-clean-card strong,
    .script-group-head strong {
      font-size: 12px;
      font-weight: 900;
    }

    .script-clean-card textarea,
    .script-group-card textarea {
      width: 100%;
      margin-top: 8px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.92);
      padding: 10px;
      color: #0f172a;
      font-size: 13px;
      line-height: 1.55;
      outline: none;
      resize: vertical;
    }

    .script-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .script-badge {
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(79, 70, 229, 0.1);
      color: #4338ca;
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .script-group-meta {
      margin-top: 7px;
      color: rgba(15, 23, 42, 0.56);
      font-size: 12px;
      line-height: 1.5;
    }

    .script-segment-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .script-segment-chip {
      border-radius: 999px;
      padding: 5px 8px;
      background: rgba(15, 23, 42, 0.06);
      color: rgba(15, 23, 42, 0.76);
      font-size: 11px;
      font-weight: 800;
    }

    .script-group-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .script-group-actions button {
      height: 30px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 9px;
      background: rgba(248, 250, 252, 0.92);
      color: #0f172a;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 850;
    }

    .script-group-actions button:hover {
      border-color: rgba(79, 70, 229, 0.3);
      background: rgba(79, 70, 229, 0.08);
    }

    .script-merge-toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(15, 23, 42, 0.09);
      border-radius: 14px;
      padding: 10px;
      background: rgba(248, 250, 252, 0.96);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    .script-merge-toolbar span {
      color: rgba(15, 23, 42, 0.6);
      font-size: 12px;
      font-weight: 850;
    }

    .script-merge-toolbar div {
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
    }

    .script-merge-toolbar button {
      height: 30px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 9px;
      background: #fff;
      color: #0f172a;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 850;
    }

    .script-merge-toolbar button.primary {
      border-color: transparent;
      background: #0f172a;
      color: #fff;
    }

    .script-merge-toolbar button:disabled {
      cursor: not-allowed;
      opacity: .42;
    }

    .script-paragraph-list {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    .script-paragraph-card {
      min-width: 0;
      border: 1px solid rgba(15, 23, 42, 0.09);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      color: #0f172a;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .script-paragraph-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .script-paragraph-card.is-selected {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.22), 0 14px 28px rgba(15, 23, 42, 0.16);
    }

    .script-paragraph-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .script-paragraph-head strong {
      color: #0f172a;
      font-size: 15px;
      font-weight: 950;
    }

    .script-paragraph-card .script-badge {
      background: rgba(79, 70, 229, 0.1);
      color: #4338ca;
    }

    .script-chip-row {
      display: flex;
      gap: 8px;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 6px;
    }

    .script-text-chip {
      flex: 0 0 auto;
      min-width: 118px;
      max-width: 220px;
      min-height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 8px;
      background: rgba(248, 250, 252, 0.92);
      color: #0f172a;
      padding: 10px 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      line-height: 1.35;
      white-space: normal;
    }

    .script-visual-unit {
      flex: 0 0 180px;
      min-height: 92px;
      display: grid;
      align-content: start;
      gap: 6px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 10px;
      background: rgba(248, 250, 252, 0.94);
      color: #0f172a;
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }

    .script-visual-unit:hover {
      border-color: rgba(79, 70, 229, 0.3);
      background: rgba(79, 70, 229, 0.06);
    }

    .script-visual-unit.is-selected {
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
    }

    .script-visual-unit.is-locked {
      background: rgba(254, 242, 242, 0.88);
      border-color: rgba(220, 38, 38, 0.18);
    }

    .script-visual-unit.is-guided {
      background: rgba(255, 251, 235, 0.9);
      border-color: rgba(217, 119, 6, 0.18);
    }

    .script-visual-unit span,
    .script-visual-unit small {
      color: rgba(15, 23, 42, 0.56);
      font-size: 11px;
      font-weight: 850;
    }

    .script-visual-unit b {
      display: -webkit-box;
      overflow: hidden;
      color: #0f172a;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.42;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .script-paragraph-card textarea {
      width: 100%;
      min-height: 58px;
      margin-top: 8px;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 8px;
      background: rgba(248, 250, 252, 0.92);
      color: #0f172a;
      padding: 9px;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      cursor: text;
    }


    .node-section input:not([type="checkbox"]) {
      padding: 0 11px;
    }

    .node-section textarea {
      min-height: 112px;
      padding: 10px 11px;
      line-height: 1.55;
      resize: vertical;
    }

    .node-section select {
      appearance: none;
      -webkit-appearance: none;
      padding: 0 34px 0 11px;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(15, 23, 42, 0.66) 50%),
        linear-gradient(135deg, rgba(15, 23, 42, 0.66) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 16px,
        calc(100% - 13px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .node-section input:not([type="checkbox"]):hover,
    .node-section textarea:hover,
    .node-section select:hover,
    .output-editor:hover {
      border-color: rgba(15, 23, 42, 0.2);
      background-color: #fff;
    }

    .node-section input:not([type="checkbox"]):focus,
    .node-section textarea:focus,
    .node-section select:focus,
    .output-editor:focus {
      border-color: rgba(37, 99, 235, 0.48);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .drop-zone {
      display: grid;
      place-items: center;
      gap: 5px;
      min-height: 104px;
      border: 1px dashed rgba(15, 23, 42, 0.18);
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.95);
      color: rgba(15, 23, 42, 0.66);
      font-size: 12px;
      text-align: center;
    }

    .drop-zone.is-dragover {
      border-color: rgba(37, 99, 235, 0.45);
      background: rgba(37, 99, 235, 0.06);
      color: #2563eb;
    }

    .drop-zone strong {
      color: #0f172a;
      font-size: 12px;
      font-weight: 900;
    }

    .output-editor {
      min-height: 320px;
      padding: 11px 12px;
      line-height: 1.55;
      resize: vertical;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 600;
    }

    .output-editor[readonly] {
      border-color: rgba(37, 99, 235, 0.24);
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.07), rgba(255, 255, 255, 0.86), rgba(37, 99, 235, 0.07));
      background-size: 220% 100%;
      animation: busyShimmer 1.5s ease-in-out infinite;
    }

    @keyframes busyShimmer {
      from { background-position: 180% 0; }
      to { background-position: -80% 0; }
    }

    .output-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .output-actions button {
      height: 34px;
      border: 0;
      border-radius: 10px;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.08);
      color: #0f172a;
      font-size: 12px;
      font-weight: 850;
    }

    .output-actions .primary {
      background: #0f172a;
      color: #fff;
    }

    .output-actions .primary:disabled {
      background: rgba(15, 23, 42, 0.12);
      color: rgba(15, 23, 42, 0.42);
      cursor: not-allowed;
    }

    .test-run {
      width: 100%;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 850;
    }

    .test-run:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .node-specific {
      display: grid;
      gap: 10px;
      padding: 0 14px 2px;
    }

    .node-specific[hidden] {
      display: none;
    }

    .node-specific-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: -2px;
    }

    .node-specific-head strong {
      font-size: 12px;
      font-weight: 900;
    }

    .node-specific-head span {
      color: rgba(15, 23, 42, 0.46);
      font-size: 11px;
    }

    .field-grid {
      display: grid;
      gap: 10px;
    }

    .field-grid.two {
      grid-template-columns: 1fr 1fr;
    }

    .toggle-group {
      display: grid;
      gap: 8px;
    }

    .toggle-group strong {
      color: #0f172a;
      font-size: 14px;
      font-weight: 900;
    }

    .toggle-group label {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      min-height: 34px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 10px;
      padding: 0 10px 0 36px;
      background: rgba(248, 250, 252, 0.88);
      color: rgba(15, 23, 42, 0.72);
      font-size: 12px;
      font-weight: 800;
    }

    .toggle-group input[type="checkbox"] {
      position: absolute;
      left: 11px;
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #2563eb;
    }

    .toggle-group label:has(input:checked) {
      border-color: rgba(37, 99, 235, 0.28);
      background: rgba(37, 99, 235, 0.08);
      color: #0f172a;
    }

    .node-specific .helper {
      color: rgba(15, 23, 42, 0.52);
      font-size: 11px;
      line-height: 1.45;
    }

    .node-specific .preview-card {
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
    }

    .danger-action {
      width: 100%;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 10px;
      border: 1px solid rgba(185, 28, 28, 0.18);
      border-radius: 10px;
      background: #fff;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 850;
    }

    .danger-action:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .execution-log {
      max-height: 142px;
      overflow: auto;
      padding: 0 14px 14px;
    }

    .execution-log h4 {
      margin: 0 0 8px;
      color: rgba(15, 23, 42, 0.5);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .log-item {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      gap: 8px;
      margin-top: 7px;
      color: rgba(15, 23, 42, 0.64);
      font-size: 11px;
      line-height: 1.45;
    }

    .log-item i {
      width: 7px;
      height: 7px;
      margin-top: 4px;
      border-radius: 50%;
      background: #22c55e;
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 1fr;
        overflow: auto;
      }

      .panel {
        min-height: 240px;
      }

      .canvas-wrap {
        min-height: 640px;
      }

      .node-popover {
        width: min(420px, calc(100% - 24px));
      }

    }
  </style>
</head>
  <body>
  <div class="app">
    <main class="workspace">
      <aside class="panel">
        <div class="panel-head">
          <span class="panel-icon">◇</span>
          <div>
            <strong>项目列表</strong>
            <p>每个项目拥有独立画布、节点连线和执行输出。</p>
          </div>
        </div>
        <div class="project-panel">
          <div class="project-actions">
            <input id="projectNameInput" placeholder="新项目名称" />
            <button id="newProjectBtn" type="button">新建</button>
          </div>
          <div class="project-list" id="projectList"></div>
        </div>
        <div class="panel-subhead">
          <span>节点库</span>
          <span>添加到当前项目</span>
        </div>
        <div class="node-palette" id="palette"></div>
      </aside>

      <section class="canvas-wrap">
        <div class="toolbar">
          <div>
            <strong id="currentProjectTitle">自由画布</strong>
            <span>拖动画布平移，按住 Cmd/Ctrl + 滚轮缩放；Shift + 拖拽可框选多个节点；点击连线可删除。</span>
          </div>
          <div class="toolbar-actions">
            <button class="template" id="buildDemoBtn" type="button">视频裂变模板</button>
            <button id="exportBtn" type="button">导出 JSON</button>
            <button class="primary" id="runBtn" type="button">试运行</button>
            <button id="zoomOut">-</button>
            <button id="fitView">适配</button>
            <button id="zoomIn">+</button>
            <span class="selection-count" id="selectionActionLabel" hidden>已选择 0 个节点</span>
            <button class="run" id="toolbarRun">运行</button>
            <button class="danger" id="deleteSelectionBtn" type="button" hidden>全部删除</button>
          </div>
        </div>
        <div class="canvas" id="canvas">
          <div class="grid"></div>
          <div class="selection-box" id="selectionBox" hidden></div>
          <svg class="edges" id="edges" width="2400" height="900" viewBox="0 0 2400 900">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"></path>
              </marker>
            </defs>
          </svg>
          <div class="world" id="world"></div>
          <div class="edge-delete-layer" id="edgeDeleteLayer"></div>
          <button class="trace-toggle" id="traceToggleBtn" type="button">执行记录</button>
          <div class="trace-panel" id="tracePanel" hidden>
            <div class="trace-head">
              <div>
                <strong>执行记录</strong>
                <span id="traceSummary">等待运行</span>
              </div>
              <button id="clearTraceBtn" type="button">清空</button>
            </div>
            <div class="trace-list" id="traceList"></div>
          </div>
        </div>
        <div class="run-strip" id="runStrip"></div>
        <div class="node-popover" id="nodePopover" hidden>
          <div class="node-popover-head">
            <div class="node-popover-head-left">
              <strong>节点配置</strong>
              <p id="selectedId">未选择</p>
            </div>
            <div class="node-popover-actions">
              <button id="showOutputBtn" type="button">输出</button>
              <button class="primary" id="runNodeBtn" type="button">执行</button>
              <button id="deleteNodeBtn" type="button">删除</button>
            </div>
          </div>

          <div class="node-popover-body">
            <div class="node-config">
              <div class="node-guide">
                <strong>使用说明</strong>
                <p id="nodeGuideText">选择一个节点后配置参数，执行结果会统一显示在右侧结果面板，可编辑并保存给下游节点使用。</p>
              </div>

              <div class="node-section">
                <div class="node-section-head">
                  <strong>基础信息</strong>
                  <span>当前节点</span>
                </div>
                <div class="node-editors">
                  <label>
                    节点名称
                    <input id="nodeTitle" />
                  </label>
                </div>
              </div>

              <div class="node-section" id="nodeSpecificSection">
                <div class="node-section-head">
                  <strong id="nodeSpecificTitle">节点配置</strong>
                  <span id="nodeSpecificTag">当前模块</span>
                </div>
                <div class="node-specific" id="nodeSpecificFields" hidden></div>
              </div>

              <div class="node-section">
                <div class="node-section-head">
                  <strong>执行日志</strong>
                  <span>最近记录</span>
                </div>
                <div class="execution-log" id="executionLog">
                  <div id="logItems"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

    function applyViewport() {
      const transform = `translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.zoom})`;
      world.style.transform = transform;
      edgeSvg.style.transform = transform;
      edgeDeleteLayer.style.transform = transform;
    }

    function projectBounds() {
      if (!nodes.length) {
        return { left: 0, top: 0, width: 2400, height: 900 };
      }
      const padding = 120;
      const rects = nodes.map((node) => {
        const size = nodeFootprint(node);
        return {
          left: node.x,
          top: node.y,
          right: node.x + size.width,
          bottom: node.y + size.height,
        };
      });
      const left = Math.max(0, Math.min(...rects.map((item) => item.left)) - padding);
      const top = Math.max(0, Math.min(...rects.map((item) => item.top)) - padding);
      const right = Math.max(...rects.map((item) => item.right)) + padding;
      const bottom = Math.max(...rects.map((item) => item.bottom)) + padding;
      return {
        left,
        top,
        width: Math.max(1200, right - left),
        height: Math.max(700, bottom - top),
      };
    }

    function renderMiniMap() {
      if (!miniMapStage || !miniMapFrame) return;
      miniMapStage.innerHTML = '';
      const canvasWidth = canvas?.clientWidth || 1;
      const canvasHeight = canvas?.clientHeight || 1;
      const bounds = projectBounds();
      const stageRect = miniMapStage.getBoundingClientRect();
      const stageWidth = Math.max(1, stageRect.width || 190);
      const stageHeight = Math.max(1, stageRect.height || 110);
      const innerPadding = 10;
      const scale = Math.min(
        (stageWidth - innerPadding * 2) / bounds.width,
        (stageHeight - innerPadding * 2) / bounds.height,
      );
      const contentWidth = bounds.width * scale;
      const contentHeight = bounds.height * scale;
      const offsetX = (stageWidth - contentWidth) / 2;
      const offsetY = (stageHeight - contentHeight) / 2;

      nodes.forEach((node) => {
        const definition = typeMap[node.type] || nodeTypes[0];
        const size = nodeFootprint(node);
        const miniNode = document.createElement('div');
        miniNode.className = `minimap-node ${definition.scope === 'global' ? 'is-global' : ''} ${definition.scope === 'loop' ? 'is-loop' : ''} ${node.type === 'content-sandbox' ? 'is-sandbox' : ''}`;
        miniNode.style.left = `${offsetX + (node.x - bounds.left) * scale}px`;
        miniNode.style.top = `${offsetY + (node.y - bounds.top) * scale}px`;
        miniNode.style.width = `${Math.max(4, size.width * scale)}px`;
        miniNode.style.height = `${Math.max(4, size.height * scale)}px`;
        miniMapStage.appendChild(miniNode);
      });

      const visibleLeft = ((-viewport.x / viewport.zoom) - bounds.left) * scale + offsetX;
      const visibleTop = ((-viewport.y / viewport.zoom) - bounds.top) * scale + offsetY;
      const visibleWidth = (canvasWidth / viewport.zoom) * scale;
      const visibleHeight = (canvasHeight / viewport.zoom) * scale;
      miniMapFrame.style.left = `${Math.max(0, visibleLeft)}px`;
      miniMapFrame.style.top = `${Math.max(0, visibleTop)}px`;
      miniMapFrame.style.width = `${Math.max(24, visibleWidth)}px`;
      miniMapFrame.style.height = `${Math.max(24, visibleHeight)}px`;
      miniMapFrame.dataset.scale = String(scale);
      miniMapStage.dataset.bounds = JSON.stringify(bounds);
      miniMapStage.dataset.offsetX = String(offsetX);
      miniMapStage.dataset.offsetY = String(offsetY);
    }

    function moveViewportToMiniMapPoint(clientX, clientY) {
      if (!miniMapStage) return;
      const stageRect = miniMapStage.getBoundingClientRect();
      const bounds = projectBounds();
      const scale = Number(miniMapStage.dataset.scale || '0.1') || 0.1;
      const offsetX = Number(miniMapStage.dataset.offsetX || '0');
      const offsetY = Number(miniMapStage.dataset.offsetY || '0');
      const localX = clientX - stageRect.left;
      const localY = clientY - stageRect.top;
      const worldX = bounds.left + (localX - offsetX) / scale;
      const worldY = bounds.top + (localY - offsetY) / scale;
      viewport.x = Math.round(canvas.clientWidth / 2 - worldX * viewport.zoom);
      viewport.y = Math.round(canvas.clientHeight / 2 - worldY * viewport.zoom);
      applyViewport();
      renderMiniMap();
    }

      return projects.find((project) => project.id === activeProjectId) || projects[0] || null;

    function sanitizeNodeForStorage(node) {
      if (!node || typeof node !== 'object') return node;
      return node;

    function sanitizeProjectForStorage(project) {
      if (!project || typeof project !== 'object') return project;
      return {
        ...project,
        nodes: Array.isArray(project.nodes) ? project.nodes.map((node) => sanitizeNodeForStorage(node)) : [],
      };
    }

      const project = activeProject();

      project.nodes = nodes.map((node) => sanitizeNodeForStorage(node));

      project.executionLogs = executionLogs;

      project.selectedNodeId = selectedNodeId;
      project.selectedNodeIds = [...selectedNodeIds];
      project.viewport = viewport;
      project.updatedAt = new Date().toISOString();

    function persistProjects() {

          activeProjectId,

    function loadProjectToCanvas(project) {
      const projectId = project?.id || activeProjectId || 'project';
      nodes = Array.isArray(project?.nodes) ? project.nodes : [];
      edges = Array.isArray(project?.edges) ? project.edges : [];
      nodeResults = project?.nodeResults && typeof project.nodeResults === 'object' ? project.nodeResults : {};
      nodes = nodes.map((node) => {
        let nextNode = node;
        if (!node.savedOutput && nodeResults[node.id]) {
          nextNode = {
          ...node,
          savedResult: nodeResults[node.id],
          savedOutput: displayOutputForNode(node, nodeResults[node.id]),
          };
        }
        if (nextNode.status === 'running') {
          return { ...nextNode, status: nodeOutputValue(nextNode) ? 'done' : 'unconfigured' };
        }
        return nextNode;
      });
      executionLogs = Array.isArray(project?.executionLogs) ? project.executionLogs : [];
      executionTrace = Array.isArray(project?.executionTrace) ? project.executionTrace : [];
      selectedNodeId = project?.selectedNodeId || nodes[0]?.id || '';
      selectedNodeIds = new Set(Array.isArray(project?.selectedNodeIds) ? project.selectedNodeIds : (selectedNodeId ? [selectedNodeId] : []));
      viewport = project?.viewport || { x: -38, y: 8, zoom: 0.74 };

      isOutputPaneOpen = false;
